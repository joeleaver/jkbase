[workspace]
resolver = "2"
members = [
    "crates/jkbase-server",
    "crates/jkbase-cli",
    "crates/jkbase-agent",
    "crates/jkbase-proxy",
    "crates/jkbase-control",
    "crates/jkbase-orch",
    "crates/jkbase-common",
    "crates/jkbase-substrate",
    "crates/jkbase-objectstore",
]

[workspace.dependencies]
jkbase-common = { path = "crates/jkbase-common" }
jkbase-proxy = { path = "crates/jkbase-proxy" }
jkbase-control = { path = "crates/jkbase-control" }
jkbase-orch = { path = "crates/jkbase-orch" }
jkbase-substrate = { path = "crates/jkbase-substrate" }

serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
bytes = "1"
bitflags = "2"
md-5 = "0.10"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http-body-util = "0.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
redb = "2"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
instant-acme = "0.8"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
rustls-pemfile = "2"
argon2 = { version = "0.5", features = ["std", "rand"] }
base64 = "0.22"
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
