# Build-VM toolchain image for Node.js server builds (npm / pnpm / yarn).
#
# apko assembles a reproducible Wolfi (glibc) rootfs. tools/build-image.sh then
# injects the jkbuild lifecycle (as /sbin/init) + the runner mountpoints and
# `mkfs.ext4 -d`'s the tree into `node.ext4` (userspace, no mount; threat-model
# P0-3). select_toolchain picks `node.ext4` for a server target detected/declared
# as `language = "node"` (any non-bun package.json sniffs as node host-side).
#
# Build-time ONLY: this image carries the full node + all three package managers.
# The deployed app runs on the lean `run-node` RUNTIME layer (node binary only) —
# npm/pnpm/yarn never ship to runtime.
#
# Pin: commit the apko.lock.json apko emits (`--lockfile`) so rebuilds are
# bitwise-reproducible (the Wolfi repo is rolling).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - ld-linux
    - ca-certificates-bundle
    - busybox # sh + mount/umount/cp/nc/reboot for the lifecycle's shell-outs
    - erofs-utils # mkfs.erofs for the layered exporter
    # Active-LTS Node + the three package managers the buildpack dispatches to by
    # lockfile (package-lock→npm, pnpm-lock→pnpm, yarn.lock→yarn). Pinned to the
    # node major; bump deliberately (keep in step with run-node's runtime layer).
    - nodejs-24
    - npm
    - pnpm
    - yarn
    # git: some npm/pnpm/yarn dependencies are `git+https://…` specs.
    - git
    # Native node-gyp modules (deferred): add build-base python3 pkgconf here when
    # that support lands. Most pure-JS apps don't need a C toolchain.

archs:
  - x86_64

# NOTE: /sbin/init (the static musl jkbuild-init) is injected by
# tools/build-image.sh after apko (INJECT_BUN=0 — Node carries no bun binary).
