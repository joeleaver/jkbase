# Build-VM toolchain image for Rust/WASM frontend builds (`trunk`).
#
# apko assembles a reproducible Wolfi (glibc) rootfs. tools/build-image.sh then
# injects the jkbuild lifecycle (as /sbin/init), the runner mountpoints, AND (the
# trunk-specific bits apko can't give us) a pinned official Rust toolchain WITH the
# `wasm32-unknown-unknown` target std plus the `trunk` CLI — via the INJECT_TRUNK
# step — and `mkfs.ext4 -d`'s the tree into `trunk.ext4` (userspace, no mount;
# threat-model P0-3). select_toolchain picks `trunk.ext4` for a STATIC target whose
# language resolves to `trunk` (a `[sites.<name>]` with `build = "trunk"`).
#
# Build-time ONLY: the Rust compiler, the wasm target std, trunk, and wasm-opt live
# here. The OUTPUT is a pure static `dist/` (HTML/JS/WASM/assets) the host serves as
# site content — there is NO runtime layer for a static site (nothing runs).
#
# Why INJECT the Rust toolchain instead of using Wolfi's `rust-N.M` (as build-rust
# does): trunk compiles to `wasm32-unknown-unknown`, whose std must be built by the
# SAME rustc as the host std, and Wolfi packages only the host std. So we bake the
# official self-contained toolchain (rustup `wasm32-unknown-unknown` target),
# mirroring the function toolchain's INJECT_RUST_WASIP2.
#
# Pin: commit the apko.lock.json apko emits (`--lockfile`) so rebuilds are
# bitwise-reproducible (the Wolfi repo is rolling).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - ld-linux
    - ca-certificates-bundle
    - busybox # sh + mount/umount/cp/nc/reboot for the lifecycle's shell-outs
    - erofs-utils # mkfs.erofs (unused by static export, but kept uniform with other toolchains)
    # C toolchain + linker: cargo links proc-macro/build-script host artifacts with
    # `cc`, and crates with build scripts (cc/bindgen/native-sys) need a working C
    # compiler even for a wasm target build.
    - build-base
    - pkgconf
    # wasm-opt (binaryen): trunk runs it on the wasm bundle in --release. Baking it on
    # PATH lets trunk skip its own github download for wasm-opt (only wasm-bindgen is
    # version-matched and warmed from the cache during fetch).
    - binaryen
    # git deps (`git = "..."` in Cargo.toml) fetched via the git CLI through the proxy.
    - git

archs:
  - x86_64

# NOTE: /sbin/init (the static musl jkbuild-init) is injected by
# tools/build-image.sh. The Rust toolchain (+ wasm32-unknown-unknown std) and the
# `trunk` CLI are injected by the INJECT_TRUNK step (INJECT_BUN=0 — trunk carries no
# bun binary). Build with:
#   INJECT_BUN=0 INJECT_TRUNK=1 CONFIG=images/apko/build-trunk.apko.yaml \
#     OUT=.firecracker/toolchains/trunk.ext4 tools/build-image.sh
