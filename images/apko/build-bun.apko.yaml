# Build-VM toolchain image for Bun server builds (WS2).
#
# apko assembles a reproducible Wolfi (glibc) rootfs from pinned apks. Bun's
# official Linux binary is glibc, so Wolfi (glibc, not musl/Alpine) is the right
# base. tools/build-image.sh then injects the baked `bun` binary + the jkbuild
# lifecycle (as /sbin/init) + the runner mountpoints and `mkfs.ext4 -d`'s the tree
# into `bun.ext4` (userspace, no mount; threat-model P0-3). select_toolchain picks
# `bun.ext4` for a server target detected/declared as `language = "bun"`.
#
# We deliberately do NOT use melange here for v1: the only non-Wolfi bits (bun +
# jkbuild-init) are injected in the staging step, so no custom apk / signing key
# is needed. A melange-packaged `jkbuild` apk is a later reproducibility refinement.
#
# Pin: commit the apko.lock.json apko emits (`--lockfile`) so rebuilds are
# bitwise-reproducible.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc # Bun + most runtimes are glibc binaries
    - ld-linux
    - ca-certificates-bundle
    - busybox # sh + mount/umount/cp/nc/reboot for the lifecycle's shell-outs
    - erofs-utils # mkfs.erofs for the layered exporter
    # Real Node.js — BUILD-TIME ONLY (this toolchain image; NOT the runtime layer).
    # JS build tooling (Vite/Rollup/Babel) is Node-native. `bun run build` honours a
    # tool's `#!/usr/bin/env node` shebang and delegates to real node when it's on
    # PATH; without node, bun runs the tool on its own runtime and hits genuine
    # resolver bugs — e.g. vite-plugin-solid statically imports `solid-refresh/babel`,
    # which under the bun runtime fails `Cannot find module '../dist/babel.cjs' from ''`
    # (reproduces ONLY under bun, fully offline; real node resolves it). Aliasing
    # node->bun does NOT help — the bug is bun's engine, not the name. The deployed
    # server still runs on bun; node is borrowed only for the hermetic compile step.
    # Pinned to the Active-LTS major for reproducible builds (Wolfi ships
    # nodejs-16..26); bump deliberately. npm/npx are intentionally omitted — under the
    # Bun buildpack, install is `bun install` and tool bins (vite, …) run directly via
    # their node shebang; add Wolfi `npm` only if a tenant build genuinely needs it.
    - nodejs-24
    # - composefs        # mkcomposefs (file-level dedup; enable once confirmed in Wolfi)
    # Native node-gyp modules (deferred): add build-base gcc glibc-dev python3
    # pkgconf here when that support lands.

archs:
  - x86_64

# NOTE: /sbin/init (the static musl jkbuild-init) and /opt/bun/bin/bun are
# injected by tools/build-image.sh after apko, not declared here.
