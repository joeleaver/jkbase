# The shared runtime BASE layer every Bun (and, later, Node/Python/Go) app runs
# on top of (WS2 / §8 dedup). Minimal Wolfi glibc + CA certs + tzdata + a nonroot
# user. Built once, content-addressed by digest, attached read-only (with
# fs-verity) to every runtime microVM — so one copy is shared across all tenants
# on that runtime (storage + cold-start win).
#
# Bun itself lives in the APP/per-version layer, NOT here, so a Bun-version bump
# never forks the shared base and dedup holds across versions.
#
# tools/build-base-layer.sh turns this into an erofs layer blob, enables fs-verity
# on it, and stages it into the host content-addressed layer store by digest.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - ld-linux
    - ca-certificates-bundle
    - tzdata
    # /bin/sh + coreutils: `bun run <script>` (and most runtimes) shell out to run
    # the package.json start script; without a shell the launch errors MissingShell.
    - busybox

archs:
  - x86_64

accounts:
  users:
    - username: app
      uid: 65532
  groups:
    - groupname: app
      gid: 65532
  run-as: 65532
