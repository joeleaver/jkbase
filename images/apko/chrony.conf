# jkbase guest wall-clock discipline. Baked read-only at /etc/chrony.conf and read
# by the chronyd that jkbase-agent supervises. See crates/jkbase-agent/src/clock.rs.
#
# The KVM-backed PTP device is the guest's host-disciplined time source: chrony
# reads the host's UTC from /dev/ptp0 with cheap paravirt calls (no network, no NTP
# servers) and corrects both the free-running-tsc frequency error and any offset.
#
# refclock PHC /dev/ptp0 — read the host's clock from the KVM PTP device. `poll 1`
# updates every 2^1 = 2 s; `dpoll -2` reads the PHC 4x/s internally; `offset 0` (the
# PHC is the host clock, no cable delay). Firecracker suggests `poll 3` (8 s), but
# this is a wake-on-demand platform where VMs resume frequently and must reach
# correct wall-clock fast — at poll 1 chrony acquires a fresh post-resume sample in
# ~2 s (vs ~50 s at poll 3), and PHC reads are cheap paravirt calls.
refclock PHC /dev/ptp0 poll 1 dpoll -2 offset 0

# Step (don't slew) when the offset exceeds 1 s, with NO limit on how often. Every
# hibernate/resume jump is a large offset toward the trusted host clock, so it must
# be stepped (slewing minutes/hours at chrony's ~1/12 max rate would take far
# longer); steady-state ppm drift stays under 1 s and is slewed smoothly.
makestep 1.0 -1

# Writable state on the /run tmpfs the agent mounts. Persists across hibernate/
# resume (it's in the snapshot); re-learned within minutes on a cold boot.
driftfile /run/chrony/drift
