# Build-VM toolchain image for Python server builds (pip).
#
# apko assembles a reproducible Wolfi (glibc) rootfs. tools/build-image.sh then
# injects the jkbuild lifecycle (as /sbin/init) + the runner mountpoints and
# `mkfs.ext4 -d`'s the tree into `python.ext4` (userspace, no mount; threat-model
# P0-3). select_toolchain picks `python.ext4` for a server target detected/declared
# as `language = "python"` (a requirements.txt / pyproject.toml / setup.py / Pipfile
# sniffs as python host-side).
#
# Build-time ONLY: this image carries CPython + pip + a C toolchain (so sdists that
# compile native extensions build). The deployed app runs on the lean `run-python`
# RUNTIME layer (the interpreter only) — pip/dev headers never ship to runtime.
#
# Pin: commit the apko.lock.json apko emits (`--lockfile`) so rebuilds are
# bitwise-reproducible (the Wolfi repo is rolling).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - ld-linux
    - ca-certificates-bundle
    - busybox # sh + mount/umount/cp/nc/reboot for the lifecycle's shell-outs
    - erofs-utils # mkfs.erofs for the layered exporter
    # CPython + pip. Pinned to the 3.12 minor; bump deliberately (keep in step with
    # run-python's runtime layer). py3.12-pip provides `python3.12 -m pip`.
    - python-3.12
    - py3.12-pip
    # Native-extension build deps: many pip packages ship manylinux wheels (no build
    # needed), but an sdist-only dep compiles against the C toolchain + Python headers.
    - build-base
    - python-3.12-dev
    - pkgconf
    # git: some pip requirements are `git+https://…` specs.
    - git

# NB: the `python-3.12` package already provides /usr/bin/python3 (→ python3.12), so
# the buildpack's PYTHON_BIN = /usr/bin/python3 resolves without an extra symlink.

archs:
  - x86_64

# NOTE: /sbin/init (the static musl jkbuild-init) is injected by
# tools/build-image.sh after apko (INJECT_BUN=0 — Python carries no bun binary).
