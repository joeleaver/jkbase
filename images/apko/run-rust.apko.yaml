# The shared Rust RUNTIME layer (the per-language overlay between the tenant app
# binary and the shared Wolfi base). A default `cargo build` binary is glibc-dynamic
# and links the C-runtime unwinder `libgcc_s.so.1`, which the base (glibc + ld-linux
# only) does not carry. This layer supplies exactly that — it is tiny.
#
# In practice the base layer's glibc/ld-linux closure ALREADY ships
# /usr/lib/libgcc_s.so.1, so tools/build-base-layer.sh's delta against base drops it
# too — this runtime layer ends up essentially EMPTY (a glibc-dynamic rust binary
# runs on the base layer alone). It still exists so the host layer plan's
# per-language runtime lookup resolves `rust` uniformly with bun/node; if a future
# base stops shipping libgcc_s, this layer is where it would be reintroduced.
#
# C++-linking crates (cc with -lstdc++) would additionally need libstdc++ at
# runtime — a deliberate v1 omission (add it here if a real app needs it). A
# pure-Rust web app (axum/hyper/tokio + rustls) needs only libgcc_s + glibc.
#
# Built into a content-addressed erofs blob by tools/build-base-layer.sh and
# recorded under `runtimes.rust` in the layer store's platform.json.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - libgcc

archs:
  - x86_64
