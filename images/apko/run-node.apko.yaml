# The shared Node.js RUNTIME layer (the per-language overlay between the tenant app
# layer and the shared Wolfi base). Just the `node` binary + its library closure —
# NOT npm/pnpm/yarn (those are build-time only). One copy is shared across every
# Node tenant on a given node major (storage + cold-start dedup).
#
# `nodejs-NN-minimal` is the runtime node (no npm/docs). apko pulls its closure
# (glibc, libstdc++, …); tools/build-base-layer.sh DELTAs the rootfs against the
# shared base stage so the layer carries only the files NOT already in base (node +
# its non-base libs), keeping glibc unduplicated. Keep the major in step with
# build-node.apko.yaml's `nodejs-24`.
#
# Built into a content-addressed erofs blob by tools/build-base-layer.sh and
# recorded under `runtimes.node` in the layer store's platform.json; the host
# attaches it (RO, fs-verity) beneath every Node app's overlay.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - nodejs-24-minimal

archs:
  - x86_64
