# Build-VM toolchain image for WASM **function** builds (Rust → `wasi:http` component).
#
# apko assembles a reproducible Wolfi (glibc) base. tools/build-image.sh then
# injects the jkbuild lifecycle (`/sbin/init`), the runner mountpoints, busybox
# applets, AND — unique to this image — a pinned official Rust toolchain with the
# `wasm32-wasip2` target std at `/opt/rust` (INJECT_RUST_WASIP2=1), because Wolfi
# packages only the host std, not the wasip2 target std. `mkfs.ext4 -d` into
# `jkbuild-function.ext4` (userspace, no mount; threat-model P0-3).
#
# select_toolchain picks `jkbuild-function.ext4` for ANY function target (the kind
# is keyed per-image, not per-language — a Rust function never grabs server
# `rust.ext4`). The in-VM `jkbuild::function_build` dispatches on language and runs
# `cargo build --release --target wasm32-wasip2`, which emits a component directly.
#
# WHY inject the official Rust toolchain instead of Wolfi `rust-1.95`: the wasip2
# target std must be built by the SAME rustc that compiles the function, or its
# strict-version-hash won't load. The official dist ships rustc + a matching wasip2
# std together (and its binaries target an old glibc, so they run on Wolfi's newer
# glibc). cargo-component is NOT needed — the wasip2 target emits a component.
#
# Pin: commit the apko.lock.json apko emits (`--lockfile`) so the Wolfi base is
# bitwise-reproducible (the Rust toolchain is pinned separately by version).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - glibc
    - ld-linux
    - ca-certificates-bundle
    - busybox # sh + mount/umount/cp/nc/reboot for the lifecycle's shell-outs
    - erofs-utils # mkfs.erofs (shared with the server exporter; harmless here)
    # C toolchain + linker: proc-macros and build scripts (serde, wit-bindgen, …)
    # compile to the HOST target and link with `cc`, so a host C toolchain is
    # required even though the function itself links via the bundled rust-lld.
    - build-base
    - pkgconf
    # git deps (`git = "..."` in Cargo.toml / `git+https` npm specs) via the git CLI.
    - git
    # Component inspection / sanity (not required to build; cheap to ship).
    - wasm-tools
    # JS/TS path: Node runs the componentizer (jco + componentize-js + esbuild, injected
    # by tools/build-image.sh) and `npm install`s the tenant's dependencies during fetch.
    - nodejs-24
    - npm

archs:
  - x86_64

# NOTE: /sbin/init (static musl jkbuild-init) AND the pinned Rust+wasip2 toolchain
# at /opt/rust are injected by tools/build-image.sh (INJECT_BUN=0,
# INJECT_RUST_WASIP2=1) after apko.
