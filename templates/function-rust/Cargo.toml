# Standalone (own workspace) so it is not pulled into the jkbase workspace and so a
# tenant can copy this directory out as-is. Built server-side to a `wasi:http` component
# with `cargo build --release --target wasm32-wasip2` (the wasip2 target emits a
# component directly; no cargo-component ceremony).
[workspace]

[package]
name = "jkbase-function"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasi = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
