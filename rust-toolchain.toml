# Pin the Rust toolchain so the wasmtime/musl `jkbase-agent` link (the most
# fragile build) is reproducible across dev boxes and prod. The musl + wasi
# targets are needed for the runtime agent (PID1) and WASM functions.
# Bump deliberately (and re-validate the agent boots) — a floating channel is
# exactly the kind of silent drift `tools/dev` exists to prevent.
[toolchain]
channel = "1.95.0"
targets = ["x86_64-unknown-linux-musl", "wasm32-wasip1"]
profile = "minimal"
