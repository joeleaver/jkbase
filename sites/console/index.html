<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jkbase console</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0f;
  --bg-raised: #111118;
  --bg-input: #0d0d14;
  --border: #1a1a2e;
  --border-hover: #2a2a4e;
  --text: #e0e0e8;
  --text-dim: #888899;
  --accent: #00d4ff;
  --accent-hover: #33dfff;
  --accent-dim: rgba(0, 212, 255, 0.1);
  --danger: #ff4466;
  --danger-hover: #ff6680;
  --danger-dim: rgba(255, 68, 102, 0.1);
  --success: #00cc88;
  --mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", "Monaco", monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* --- Header --- */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.02em;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-email {
  font-size: 13px;
  color: var(--text-dim);
}

/* --- Buttons --- */

.btn {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--border-hover);
  background: var(--bg-raised);
}

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  padding: 6px 12px;
}

.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  background: var(--bg-raised);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(255, 68, 102, 0.25);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-dim);
  border-color: var(--danger);
}

.btn-sm {
  font-size: 12px;
  padding: 5px 10px;
}

/* --- Inputs --- */

.input {
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
  width: 100%;
}

.input:focus {
  border-color: var(--accent);
}

.input::placeholder {
  color: var(--text-dim);
}

/* --- Auth Screen --- */

.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 400px;
}

.auth-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: -0.02em;
}

.auth-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 32px;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.auth-form .input {
  margin-bottom: 4px;
}

.auth-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.auth-actions .btn {
  flex: 1;
}

.auth-divider {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  margin: 20px 0;
  position: relative;
}

.auth-divider::before,
.auth-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 20px);
  height: 1px;
  background: var(--border);
}

.auth-divider::before { left: 0; }
.auth-divider::after { right: 0; }

.auth-back {
  margin-top: 16px;
  text-align: center;
}

/* --- Console Layout --- */

.console {
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 24px;
}

.console-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.console-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

/* --- Project Cards --- */

.project-grid {
  display: grid;
  gap: 12px;
}

.project-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px;
  transition: border-color 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.project-card:hover {
  border-color: var(--border-hover);
}

.project-info {
  min-width: 0;
  flex: 1;
}

.project-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.project-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.project-version {
  font-size: 12px;
  color: var(--text-dim);
}

.project-url a {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  word-break: break-all;
}

.project-url a:hover {
  text-decoration: underline;
}

.project-actions {
  flex-shrink: 0;
}

/* --- Empty State --- */

.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--text-dim);
  font-size: 14px;
}

.empty-state p:first-child {
  margin-bottom: 8px;
  color: var(--text);
  font-size: 15px;
}

/* --- Modal --- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
}

.modal-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 4px;
}

/* --- Loading / Error --- */

.loading {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-dim);
  font-size: 14px;
}

.error-msg {
  color: var(--danger);
  font-size: 13px;
  margin-top: 8px;
}

.error-banner {
  background: var(--danger-dim);
  border: 1px solid rgba(255, 68, 102, 0.3);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--danger);
  font-size: 13px;
  margin-bottom: 16px;
}

/* --- Confirm Dialog --- */

.confirm-text {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.5;
}

.confirm-project-name {
  color: var(--accent);
  font-weight: 600;
}

/* --- Responsive --- */

@media (max-width: 600px) {
  .header {
    padding: 0 16px;
  }

  .console {
    padding: 24px 16px;
  }

  .project-card {
    flex-direction: column;
    align-items: flex-start;
  }

  .project-actions {
    align-self: flex-end;
  }

  .auth-actions {
    flex-direction: column;
  }

  .header-email {
    display: none;
  }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function() {
  "use strict";

  const API = "https://api.jkbase.app";
  const TOKEN_KEY = "jkbase_token";
  const EMAIL_KEY = "jkbase_email";

  const app = document.getElementById("app");

  // --- State ---
  let state = {
    token: localStorage.getItem(TOKEN_KEY) || null,
    email: localStorage.getItem(EMAIL_KEY) || null,
    projects: [],
    loading: false,
    error: null,
    view: "loading", // loading, auth, auth-signin, console
    showNewProjectModal: false,
    deleteConfirm: null, // project object or null
  };

  // --- API helpers ---

  async function api(method, path, body) {
    const headers = { "Content-Type": "application/json" };
    if (state.token) {
      headers["Authorization"] = "Bearer " + state.token;
    }
    const opts = { method, headers };
    if (body) {
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(API + path, opts);
    if (res.status === 401) {
      logout();
      throw new Error("Session expired. Please sign in again.");
    }
    if (res.status === 204) {
      return null;
    }
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
    }
    return data;
  }

  // --- Auth ---

  function logout() {
    state.token = null;
    state.email = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMAIL_KEY);
    state.view = "auth";
    state.projects = [];
    state.error = null;
    render();
  }

  async function verifyToken() {
    try {
      const me = await api("GET", "/me");
      state.email = me.email;
      localStorage.setItem(EMAIL_KEY, me.email);
      state.view = "console";
      render();
      loadProjects();
    } catch (e) {
      state.token = null;
      localStorage.removeItem(TOKEN_KEY);
      state.view = "auth";
      render();
    }
  }

  async function register(email) {
    state.error = null;
    state.loading = true;
    render();
    try {
      const data = await api("POST", "/register", { email: email });
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "console";
      render();
      loadProjects();
    } catch (e) {
      state.loading = false;
      state.error = e.message;
      render();
    }
  }

  async function signInWithToken(token) {
    state.error = null;
    state.loading = true;
    state.token = token;
    localStorage.setItem(TOKEN_KEY, token);
    render();
    try {
      const me = await api("GET", "/me");
      state.email = me.email;
      localStorage.setItem(EMAIL_KEY, me.email);
      state.loading = false;
      state.view = "console";
      render();
      loadProjects();
    } catch (e) {
      state.token = null;
      localStorage.removeItem(TOKEN_KEY);
      state.loading = false;
      state.error = "Invalid token. Please check and try again.";
      state.view = "auth-signin";
      render();
    }
  }

  // --- Projects ---

  async function loadProjects() {
    state.loading = true;
    state.error = null;
    render();
    try {
      state.projects = await api("GET", "/projects");
      state.loading = false;
      render();
    } catch (e) {
      state.loading = false;
      state.error = e.message;
      render();
    }
  }

  async function createProject(name) {
    state.error = null;
    state.loading = true;
    render();
    try {
      await api("POST", "/projects", { name: name });
      state.showNewProjectModal = false;
      state.loading = false;
      render();
      loadProjects();
    } catch (e) {
      state.loading = false;
      state.error = e.message;
      render();
    }
  }

  async function deleteProject(id) {
    state.error = null;
    state.deleteConfirm = null;
    state.loading = true;
    render();
    try {
      await api("DELETE", "/projects/" + id);
      state.loading = false;
      render();
      loadProjects();
    } catch (e) {
      state.loading = false;
      state.error = e.message;
      render();
    }
  }

  // --- Rendering ---

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === "className") {
          el.className = v;
        } else if (k === "htmlFor") {
          el.setAttribute("for", v);
        } else {
          el.setAttribute(k, v);
        }
      }
    }
    for (const child of children) {
      if (child == null || child === false) continue;
      if (typeof child === "string" || typeof child === "number") {
        el.appendChild(document.createTextNode(child));
      } else if (Array.isArray(child)) {
        child.forEach(function(c) { if (c) el.appendChild(c); });
      } else {
        el.appendChild(child);
      }
    }
    return el;
  }

  function renderAuthScreen() {
    return h("div", { className: "auth-screen" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-title" }, "jkbase"),
        h("div", { className: "auth-subtitle" }, "management console"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "auth-form", onSubmit: function(e) {
          e.preventDefault();
          var email = e.target.querySelector("input").value.trim();
          if (email) register(email);
        }},
          h("input", {
            className: "input",
            type: "email",
            placeholder: "you@example.com",
            required: "required",
            autocomplete: "email",
            disabled: state.loading ? "disabled" : null,
          }),
          h("div", { className: "auth-actions" },
            h("button", {
              className: "btn btn-primary",
              type: "submit",
              disabled: state.loading ? "disabled" : null,
            }, state.loading ? "Creating..." : "Create Account"),
            h("button", {
              className: "btn btn-secondary",
              type: "button",
              disabled: state.loading ? "disabled" : null,
              onClick: function() {
                state.error = null;
                state.view = "auth-signin";
                render();
              },
            }, "Sign In"),
          )
        )
      )
    );
  }

  function renderSignInScreen() {
    return h("div", { className: "auth-screen" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-title" }, "jkbase"),
        h("div", { className: "auth-subtitle" }, "sign in with your API token"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "auth-form", onSubmit: function(e) {
          e.preventDefault();
          var token = e.target.querySelector("input").value.trim();
          if (token) signInWithToken(token);
        }},
          h("input", {
            className: "input",
            type: "text",
            placeholder: "paste your API token",
            required: "required",
            autocomplete: "off",
            spellcheck: "false",
            disabled: state.loading ? "disabled" : null,
          }),
          h("div", { className: "auth-actions" },
            h("button", {
              className: "btn btn-primary",
              type: "submit",
              disabled: state.loading ? "disabled" : null,
            }, state.loading ? "Verifying..." : "Sign In")
          )
        ),
        h("div", { className: "auth-back" },
          h("button", {
            className: "btn btn-ghost btn-sm",
            onClick: function() {
              state.error = null;
              state.view = "auth";
              render();
            },
          }, "Back to registration")
        )
      )
    );
  }

  function renderProjectCard(project) {
    return h("div", { className: "project-card" },
      h("div", { className: "project-info" },
        h("div", { className: "project-name" }, project.name),
        h("div", { className: "project-meta" },
          project.current_version != null
            ? h("span", { className: "project-version" }, "v" + project.current_version)
            : h("span", { className: "project-version" }, "no deployments"),
          project.url
            ? h("span", { className: "project-url" },
                h("a", { href: project.url, target: "_blank", rel: "noopener" }, project.url)
              )
            : null
        )
      ),
      h("div", { className: "project-actions" },
        h("button", {
          className: "btn btn-danger btn-sm",
          onClick: function() {
            state.deleteConfirm = project;
            render();
          },
        }, "Delete")
      )
    );
  }

  function renderConsole() {
    return h("div", null,
      h("header", { className: "header" },
        h("div", { className: "header-brand" }, "jkbase console"),
        h("div", { className: "header-right" },
          h("span", { className: "header-email" }, state.email || ""),
          h("button", { className: "btn btn-ghost btn-sm", onClick: logout }, "Sign Out")
        )
      ),
      h("main", { className: "console" },
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("div", { className: "console-toolbar" },
          h("div", { className: "console-title" }, "Projects"),
          h("button", {
            className: "btn btn-primary btn-sm",
            onClick: function() {
              state.showNewProjectModal = true;
              state.error = null;
              render();
            },
          }, "+ New Project")
        ),
        state.loading
          ? h("div", { className: "loading" }, "Loading...")
          : state.projects.length === 0
            ? h("div", { className: "empty-state" },
                h("p", null, "No projects yet"),
                h("p", null, "Create your first project to get started.")
              )
            : h("div", { className: "project-grid" },
                state.projects.map(renderProjectCard)
              )
      ),
      state.showNewProjectModal ? renderNewProjectModal() : null,
      state.deleteConfirm ? renderDeleteConfirm() : null
    );
  }

  function renderNewProjectModal() {
    return h("div", { className: "modal-overlay", onClick: function(e) {
      if (e.target === e.currentTarget) {
        state.showNewProjectModal = false;
        state.error = null;
        render();
      }
    }},
      h("div", { className: "modal" },
        h("div", { className: "modal-title" }, "New Project"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "modal-form", onSubmit: function(e) {
          e.preventDefault();
          var name = e.target.querySelector("input").value.trim();
          if (name) createProject(name);
        }},
          h("input", {
            className: "input",
            type: "text",
            placeholder: "project-name",
            required: "required",
            autocomplete: "off",
            pattern: "[a-zA-Z0-9][a-zA-Z0-9_-]*",
            title: "Letters, numbers, hyphens, and underscores",
          }),
          h("div", { className: "modal-actions" },
            h("button", {
              className: "btn btn-secondary",
              type: "button",
              onClick: function() {
                state.showNewProjectModal = false;
                state.error = null;
                render();
              },
            }, "Cancel"),
            h("button", {
              className: "btn btn-primary",
              type: "submit",
              disabled: state.loading ? "disabled" : null,
            }, state.loading ? "Creating..." : "Create")
          )
        )
      )
    );
  }

  function renderDeleteConfirm() {
    var project = state.deleteConfirm;
    return h("div", { className: "modal-overlay", onClick: function(e) {
      if (e.target === e.currentTarget) {
        state.deleteConfirm = null;
        render();
      }
    }},
      h("div", { className: "modal" },
        h("div", { className: "modal-title" }, "Delete Project"),
        h("div", { className: "confirm-text" },
          "Are you sure you want to delete ",
          h("span", { className: "confirm-project-name" }, project.name),
          "? This action cannot be undone."
        ),
        h("div", { className: "modal-actions" },
          h("button", {
            className: "btn btn-secondary",
            onClick: function() {
              state.deleteConfirm = null;
              render();
            },
          }, "Cancel"),
          h("button", {
            className: "btn btn-danger",
            onClick: function() {
              deleteProject(project.id);
            },
            disabled: state.loading ? "disabled" : null,
          }, state.loading ? "Deleting..." : "Delete")
        )
      )
    );
  }

  function render() {
    app.innerHTML = "";
    var view;
    switch (state.view) {
      case "loading":
        view = h("div", { className: "auth-screen" },
          h("div", { className: "loading" }, "Loading...")
        );
        break;
      case "auth":
        view = renderAuthScreen();
        break;
      case "auth-signin":
        view = renderSignInScreen();
        break;
      case "console":
        view = renderConsole();
        break;
    }
    app.appendChild(view);

    // Auto-focus first input in view
    var firstInput = app.querySelector("input:not([disabled])");
    if (firstInput && !document.activeElement.matches("input")) {
      firstInput.focus();
    }
  }

  // --- Init ---

  function init() {
    if (state.token) {
      state.view = "loading";
      render();
      verifyToken();
    } else {
      state.view = "auth";
      render();
    }
  }

  init();
})();
</script>
</body>
</html>
