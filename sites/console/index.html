<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jkbase console</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #08080c;
  --bg-sidebar: #0c0c14;
  --bg-card: #0f0f18;
  --bg-input: #0a0a12;
  --bg-code: #060610;
  --border: #1a1a28;
  --border-hover: #2a2a48;
  --text: #e0e0e8;
  --text-dim: #6e6e80;
  --accent: #00d4ff;
  --accent-hover: #33dfff;
  --accent-dim: rgba(0, 212, 255, 0.08);
  --danger: #ff4466;
  --danger-hover: #ff6680;
  --danger-dim: rgba(255, 68, 102, 0.08);
  --success: #00cc88;
  --success-dim: rgba(0, 204, 136, 0.08);
  --mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
  --sidebar-w: 240px;
  --transition: 150ms ease;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* --- Focus States --- */

*:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- Buttons --- */

.btn {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  line-height: 1.4;
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--border-hover);
  background: rgba(255, 255, 255, 0.03);
}

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  padding: 6px 12px;
  border: none;
}

.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.btn-danger-fill {
  background: var(--danger);
  color: #fff;
  font-weight: 600;
}

.btn-danger-fill:hover:not(:disabled) {
  background: var(--danger-hover);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(255, 68, 102, 0.25);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-dim);
  border-color: var(--danger);
}

.btn-sm {
  font-size: 12px;
  padding: 5px 10px;
}

.btn-icon {
  padding: 4px 8px;
  font-size: 14px;
  line-height: 1;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 4px;
  transition: all var(--transition);
}

.btn-icon:hover {
  color: var(--danger);
  background: var(--danger-dim);
}

/* --- Inputs --- */

.input {
  font-family: var(--mono);
  font-size: 13px;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  outline: none;
  transition: border-color var(--transition);
  width: 100%;
}

.input:focus {
  border-color: var(--border-hover);
}

.input::placeholder {
  color: var(--text-dim);
}

/* --- Sidebar Layout --- */

.app-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform 200ms ease;
}

.sidebar-brand {
  padding: 20px 20px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-brand-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.sidebar-brand-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.sidebar-nav {
  flex: 1;
  padding: 0 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: var(--mono);
  width: 100%;
  text-align: left;
  transition: all var(--transition);
}

.sidebar-nav-item:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.sidebar-nav-item.active {
  color: var(--text);
  background: var(--accent-dim);
}

.sidebar-nav-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
  line-height: 1;
}

/* CSS grid icon for Projects */
.icon-grid {
  display: grid;
  grid-template-columns: 6px 6px;
  grid-template-rows: 6px 6px;
  gap: 2px;
}

.icon-grid span {
  display: block;
  border-radius: 1px;
  background: currentColor;
}

/* Account icon - simple person silhouette via CSS */
.icon-account {
  position: relative;
}

.icon-account::before {
  content: "";
  display: block;
  width: 8px;
  height: 8px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  margin: 0 auto 1px;
}

.icon-account::after {
  content: "";
  display: block;
  width: 14px;
  height: 5px;
  border: 1.5px solid currentColor;
  border-bottom: none;
  border-radius: 7px 7px 0 0;
  margin: 0 auto;
}

.sidebar-bottom {
  padding: 16px;
  border-top: 1px solid var(--border);
}

.sidebar-email {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-signout {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  transition: color var(--transition);
}

.sidebar-signout:hover {
  color: var(--text);
}

/* Mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 99;
}

.hamburger {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 101;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 10px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1;
}

.main-area {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 16px;
}

.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}

.breadcrumb-link {
  color: var(--text-dim);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 12px;
  padding: 0;
  transition: color var(--transition);
}

.breadcrumb-link:hover {
  color: var(--accent);
}

.breadcrumb-sep {
  color: var(--text-dim);
  opacity: 0.5;
}

.breadcrumb-current {
  color: var(--text);
}

.content {
  flex: 1;
  padding: 28px 32px;
  max-width: 860px;
  width: 100%;
}

/* --- Cards / Sections --- */

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
  gap: 12px;
}

.card-header:hover {
  background: rgba(255, 255, 255, 0.015);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-chevron {
  color: var(--text-dim);
  font-size: 11px;
  transition: transform var(--transition);
  flex-shrink: 0;
}

.card-chevron.open {
  transform: rotate(90deg);
}

.card-body {
  padding: 0 20px 18px;
}

.card-static {
  padding: 18px 20px;
}

/* --- Project Table --- */

.project-table {
  width: 100%;
  border-collapse: collapse;
}

.project-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0 16px 10px;
  border-bottom: 1px solid var(--border);
}

.project-table td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid rgba(26, 26, 40, 0.5);
  vertical-align: middle;
}

.project-table tr:last-child td {
  border-bottom: none;
}

.project-table tr:hover td {
  background: rgba(255, 255, 255, 0.015);
}

.project-name-link {
  color: var(--text);
  font-weight: 500;
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 13px;
  padding: 0;
  transition: color var(--transition);
  text-align: left;
}

.project-name-link:hover {
  color: var(--accent);
}

.status-deployed {
  font-size: 12px;
  color: var(--success);
}

.status-not-deployed {
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
}

.project-url-link {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  word-break: break-all;
}

.project-url-link:hover {
  text-decoration: underline;
}

.dim-dash {
  color: var(--text-dim);
}

/* --- Detail Header --- */

.detail-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.detail-url {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
}

.detail-url:hover {
  text-decoration: underline;
}

/* --- Onboarding --- */

.onboarding {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 40px 32px;
  text-align: center;
  max-width: 560px;
  margin: 40px auto 0;
}

.onboarding-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.onboarding-subtitle {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 32px;
}

.onboarding-steps {
  list-style: none;
  counter-reset: steps;
  display: flex;
  flex-direction: column;
  gap: 20px;
  text-align: left;
  margin-bottom: 28px;
}

.onboarding-step {
  counter-increment: steps;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.onboarding-step::before {
  content: counter(steps);
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin-top: 1px;
}

.onboarding-step-content {
  flex: 1;
  min-width: 0;
}

.onboarding-step-label {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 4px;
}

.onboarding-step-desc {
  font-size: 12px;
  color: var(--text-dim);
}

/* --- Code Blocks --- */

.code-block {
  display: block;
  padding: 9px 12px;
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  color: var(--accent);
  font-family: var(--mono);
  word-break: break-all;
  user-select: all;
  margin-top: 6px;
}

.code-block-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.code-block-row .code-block {
  flex: 1;
  margin-top: 0;
}

.copy-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
}

.copy-btn:hover {
  color: var(--text);
  border-color: var(--border-hover);
}

/* --- Secrets --- */

.secret-table {
  width: 100%;
  border-collapse: collapse;
}

.secret-table td {
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid rgba(26, 26, 40, 0.5);
}

.secret-table tr:last-child td {
  border-bottom: none;
}

.secret-key {
  color: var(--text);
}

.secret-actions {
  text-align: right;
  width: 40px;
}

.secret-add-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: flex-start;
}

.secret-add-form .input {
  flex: 1;
}

.secret-delete-confirm {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--danger-dim);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.secret-delete-confirm-text {
  font-size: 12px;
  color: var(--text);
}

.secret-delete-confirm-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

/* --- Logs --- */

.log-container {
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.7;
}

.log-line {
  white-space: pre-wrap;
  word-break: break-all;
}

.log-ts {
  color: var(--text-dim);
}

.log-server {
  color: #aa88ff;
}

.log-stream-stdout {
  color: var(--text);
}

.log-stream-stderr {
  color: var(--danger);
}

.log-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}

/* --- Danger Zone --- */

.danger-zone {
  background: var(--bg-card);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 8px;
  padding: 18px 20px;
  margin-top: 16px;
}

.danger-zone-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--danger);
  margin-bottom: 8px;
}

.danger-zone-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 14px;
  line-height: 1.5;
}

.danger-zone-confirm {
  margin-top: 12px;
  padding: 12px 14px;
  background: rgba(255, 68, 102, 0.06);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 6px;
}

.danger-zone-confirm-text {
  font-size: 12px;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.5;
}

.danger-zone-confirm-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* --- Auth Screen --- */

.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 380px;
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
}

.auth-brand-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.auth-brand-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.auth-heading {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.auth-subtitle {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.auth-form .btn-primary {
  width: 100%;
  justify-content: center;
  margin-top: 4px;
}

.auth-switch {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
}

.auth-switch-link {
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 12px;
  padding: 0;
  transition: color var(--transition);
}

.auth-switch-link:hover {
  color: var(--accent-hover);
}

/* Token reveal screen */
.token-reveal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin: 20px 0;
}

.token-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}

.token-value {
  display: block;
  padding: 10px 12px;
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  color: var(--accent);
  word-break: break-all;
  user-select: all;
  margin-bottom: 10px;
  font-family: var(--mono);
}

.token-warning {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-top: 10px;
}

/* --- Account sections --- */

.account-field-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}

.account-field-value {
  font-size: 13px;
  color: var(--text);
}

.account-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 380px;
}

/* --- Modal --- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 20px;
}

.modal-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 4px;
}

/* --- Messages --- */

.loading {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-dim);
  font-size: 13px;
}

.error-banner {
  background: var(--danger-dim);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--danger);
  font-size: 12px;
  margin-bottom: 16px;
}

.success-banner {
  background: var(--success-dim);
  border: 1px solid rgba(0, 204, 136, 0.2);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--success);
  font-size: 12px;
  margin-bottom: 16px;
}

.section-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}

.highlight {
  color: var(--accent);
  font-weight: 600;
}

/* --- Responsive --- */

@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-overlay.open {
    display: block;
  }

  .hamburger {
    display: block;
  }

  .main-area {
    margin-left: 0;
  }

  .topbar {
    padding: 0 16px 0 52px;
  }

  .content {
    padding: 20px 16px;
  }

  .onboarding {
    padding: 28px 20px;
    margin-top: 20px;
  }

  .secret-add-form {
    flex-direction: column;
  }

  .project-table th:nth-child(3),
  .project-table td:nth-child(3) {
    display: none;
  }
}

@media (max-width: 480px) {
  .topbar-title {
    font-size: 14px;
  }

  .detail-title-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function() {
  "use strict";

  var API = "https://api.jkbase.app";
  var TOKEN_KEY = "jkbase_token";
  var EMAIL_KEY = "jkbase_email";

  var app = document.getElementById("app");

  // --- State ---
  var state = {
    token: localStorage.getItem(TOKEN_KEY) || null,
    email: localStorage.getItem(EMAIL_KEY) || null,
    view: "loading",
    // views: loading, auth, auth-signin, token-reveal, projects, project-detail, account
    projects: [],
    loading: false,
    error: null,
    success: null,
    showNewProjectModal: false,
    deleteConfirm: false,
    revealedToken: null,
    // project detail
    currentProject: null,
    secrets: [],
    logs: [],
    secretsLoading: false,
    logsLoading: false,
    showAddSecret: false,
    deleteSecretConfirm: null,
    // account
    accountLoading: false,
    accountError: null,
    accountSuccess: null,
    // sidebar mobile
    sidebarOpen: false,
    // collapsible sections
    sectionsOpen: { deploy: true, secrets: true, logs: true },
  };

  // --- API helpers ---

  function api(method, path, body) {
    var headers = { "Content-Type": "application/json" };
    if (state.token) {
      headers["Authorization"] = "Bearer " + state.token;
    }
    var opts = { method: method, headers: headers };
    if (body) {
      opts.body = JSON.stringify(body);
    }
    return fetch(API + path, opts).then(function(res) {
      if (res.status === 401) {
        logout();
        throw new Error("Session expired. Please sign in again.");
      }
      if (res.status === 204) {
        return null;
      }
      return res.json().then(function(data) {
        if (!res.ok) {
          throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
        }
        return data;
      });
    });
  }

  // --- Auth ---

  function logout() {
    state.token = null;
    state.email = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMAIL_KEY);
    state.view = "auth";
    state.projects = [];
    state.currentProject = null;
    state.error = null;
    state.success = null;
    state.sidebarOpen = false;
    render();
  }

  function verifyToken() {
    api("GET", "/me").then(function(me) {
      state.email = me.email;
      localStorage.setItem(EMAIL_KEY, me.email);
      state.view = "projects";
      render();
      loadProjects();
    }).catch(function() {
      state.token = null;
      localStorage.removeItem(TOKEN_KEY);
      state.view = "auth";
      render();
    });
  }

  function doRegister(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/register", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "token-reveal";
      state.revealedToken = data.token;
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function doLogin(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/login", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "projects";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Projects ---

  function loadProjects() {
    state.loading = true;
    state.error = null;
    render();
    api("GET", "/projects").then(function(projects) {
      state.projects = projects;
      state.loading = false;
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function createProject(name) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/projects", { name: name }).then(function() {
      state.showNewProjectModal = false;
      state.loading = false;
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteProject(id) {
    state.error = null;
    state.deleteConfirm = false;
    state.loading = true;
    render();
    api("DELETE", "/projects/" + id).then(function() {
      state.loading = false;
      state.currentProject = null;
      state.view = "projects";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Project Detail ---

  function openProject(project) {
    state.currentProject = project;
    state.view = "project-detail";
    state.secrets = [];
    state.logs = [];
    state.error = null;
    state.success = null;
    state.showAddSecret = false;
    state.deleteSecretConfirm = null;
    state.deleteConfirm = false;
    state.sectionsOpen = { deploy: true, secrets: true, logs: true };
    render();
    loadSecrets(project.id);
    loadLogs(project.id);
  }

  function loadSecrets(projectId) {
    state.secretsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/secrets").then(function(secrets) {
      state.secrets = secrets;
      state.secretsLoading = false;
      render();
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function addSecret(projectId, key, value) {
    state.error = null;
    state.secretsLoading = true;
    render();
    api("POST", "/projects/" + projectId + "/secrets", { key: key, value: value }).then(function() {
      state.showAddSecret = false;
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteSecret(projectId, key) {
    state.error = null;
    state.deleteSecretConfirm = null;
    state.secretsLoading = true;
    render();
    api("DELETE", "/projects/" + projectId + "/secrets/" + encodeURIComponent(key)).then(function() {
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function loadLogs(projectId) {
    state.logsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/logs?limit=200").then(function(logs) {
      state.logs = logs;
      state.logsLoading = false;
      render();
      var logEl = document.querySelector(".log-container");
      if (logEl) {
        logEl.scrollTop = logEl.scrollHeight;
      }
    }).catch(function(e) {
      state.logsLoading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Account ---

  function generateToken() {
    state.accountError = null;
    state.accountSuccess = null;
    state.accountLoading = true;
    state.revealedToken = null;
    render();
    api("POST", "/me/token", {}).then(function(data) {
      state.revealedToken = data.token;
      state.accountLoading = false;
      state.token = data.token;
      localStorage.setItem(TOKEN_KEY, data.token);
      render();
    }).catch(function(e) {
      state.accountLoading = false;
      state.accountError = e.message;
      render();
    });
  }

  function changePassword(currentPassword, newPassword) {
    state.accountError = null;
    state.accountSuccess = null;
    state.accountLoading = true;
    render();
    api("POST", "/me/password", { current_password: currentPassword, new_password: newPassword }).then(function() {
      state.accountLoading = false;
      state.accountSuccess = "Password changed successfully.";
      render();
    }).catch(function(e) {
      state.accountLoading = false;
      state.accountError = e.message;
      render();
    });
  }

  // --- Rendering ---

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      var keys = Object.keys(attrs);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === "className") {
          el.className = v;
        } else if (k === "htmlFor") {
          el.setAttribute("for", v);
        } else {
          el.setAttribute(k, v);
        }
      }
    }
    for (var a = 2; a < arguments.length; a++) {
      var child = arguments[a];
      if (child == null || child === false) continue;
      if (typeof child === "string" || typeof child === "number") {
        el.appendChild(document.createTextNode(child));
      } else if (Array.isArray(child)) {
        for (var j = 0; j < child.length; j++) {
          if (child[j] != null && child[j] !== false) el.appendChild(child[j]);
        }
      } else {
        el.appendChild(child);
      }
    }
    return el;
  }

  function formatTimestamp(ts) {
    try {
      var d = new Date(ts);
      var hh = String(d.getHours()).padStart(2, "0");
      var mm = String(d.getMinutes()).padStart(2, "0");
      var ss = String(d.getSeconds()).padStart(2, "0");
      return hh + ":" + mm + ":" + ss;
    } catch (e) {
      return ts;
    }
  }

  // --- Navigation helpers ---

  function navTo(view) {
    state.view = view;
    state.error = null;
    state.success = null;
    state.sidebarOpen = false;
    if (view === "projects") {
      state.currentProject = null;
      render();
      loadProjects();
    } else if (view === "account") {
      state.accountError = null;
      state.accountSuccess = null;
      state.revealedToken = null;
      render();
    } else {
      render();
    }
  }

  function activeNav() {
    if (state.view === "projects" || state.view === "project-detail") return "projects";
    if (state.view === "account") return "account";
    return "";
  }

  // --- Grid icon component ---

  function gridIcon() {
    var wrap = h("span", { className: "sidebar-nav-icon" });
    var grid = document.createElement("span");
    grid.className = "icon-grid";
    grid.appendChild(document.createElement("span"));
    grid.appendChild(document.createElement("span"));
    grid.appendChild(document.createElement("span"));
    grid.appendChild(document.createElement("span"));
    wrap.appendChild(grid);
    return wrap;
  }

  function accountIcon() {
    return h("span", { className: "sidebar-nav-icon icon-account" });
  }

  // --- Sidebar ---

  function renderSidebar() {
    var nav = activeNav();
    return h("div", null,
      h("div", {
        className: "sidebar-overlay" + (state.sidebarOpen ? " open" : ""),
        onClick: function() {
          state.sidebarOpen = false;
          render();
        },
      }),
      h("button", {
        className: "hamburger",
        onClick: function() {
          state.sidebarOpen = !state.sidebarOpen;
          render();
        },
        "aria-label": "Toggle menu",
      }, "="),
      h("aside", { className: "sidebar" + (state.sidebarOpen ? " open" : "") },
        h("div", { className: "sidebar-brand" },
          h("span", { className: "sidebar-brand-dot" }),
          h("span", { className: "sidebar-brand-text" }, "jkbase")
        ),
        h("nav", { className: "sidebar-nav" },
          h("button", {
            className: "sidebar-nav-item" + (nav === "projects" ? " active" : ""),
            onClick: function() { navTo("projects"); },
          },
            gridIcon(),
            "Projects"
          ),
          h("button", {
            className: "sidebar-nav-item" + (nav === "account" ? " active" : ""),
            onClick: function() { navTo("account"); },
          },
            accountIcon(),
            "Account"
          )
        ),
        h("div", { className: "sidebar-bottom" },
          h("div", { className: "sidebar-email" }, state.email || ""),
          h("button", { className: "sidebar-signout", onClick: logout }, "Sign Out")
        )
      )
    );
  }

  // --- Auth Screens ---

  function renderAuthScreen() {
    return h("div", { className: "auth-screen" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-brand" },
          h("span", { className: "auth-brand-dot" }),
          h("span", { className: "auth-brand-text" }, "jkbase")
        ),
        h("div", { className: "auth-heading" }, "Create Account"),
        h("div", { className: "auth-subtitle" }, "Get started with your new account"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "auth-form", onSubmit: function(e) {
          e.preventDefault();
          var inputs = e.target.querySelectorAll("input");
          var email = inputs[0].value.trim();
          var password = inputs[1].value;
          if (email && password) doRegister(email, password);
        }},
          h("input", {
            className: "input",
            type: "email",
            placeholder: "you@example.com",
            required: "required",
            autocomplete: "email",
            disabled: state.loading ? "disabled" : null,
          }),
          h("input", {
            className: "input",
            type: "password",
            placeholder: "password (8+ characters)",
            required: "required",
            minlength: "8",
            autocomplete: "new-password",
            disabled: state.loading ? "disabled" : null,
          }),
          h("button", {
            className: "btn btn-primary",
            type: "submit",
            disabled: state.loading ? "disabled" : null,
          }, state.loading ? "Creating..." : "Create Account")
        ),
        h("div", { className: "auth-switch" },
          "Already have an account? ",
          h("button", {
            className: "auth-switch-link",
            onClick: function() {
              state.error = null;
              state.view = "auth-signin";
              render();
            },
          }, "Sign In")
        )
      )
    );
  }

  function renderSignInScreen() {
    return h("div", { className: "auth-screen" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-brand" },
          h("span", { className: "auth-brand-dot" }),
          h("span", { className: "auth-brand-text" }, "jkbase")
        ),
        h("div", { className: "auth-heading" }, "Sign In"),
        h("div", { className: "auth-subtitle" }, "Welcome back"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "auth-form", onSubmit: function(e) {
          e.preventDefault();
          var inputs = e.target.querySelectorAll("input");
          var email = inputs[0].value.trim();
          var password = inputs[1].value;
          if (email && password) doLogin(email, password);
        }},
          h("input", {
            className: "input",
            type: "email",
            placeholder: "you@example.com",
            required: "required",
            autocomplete: "email",
            disabled: state.loading ? "disabled" : null,
          }),
          h("input", {
            className: "input",
            type: "password",
            placeholder: "password",
            required: "required",
            autocomplete: "current-password",
            disabled: state.loading ? "disabled" : null,
          }),
          h("button", {
            className: "btn btn-primary",
            type: "submit",
            disabled: state.loading ? "disabled" : null,
          }, state.loading ? "Signing in..." : "Sign In")
        ),
        h("div", { className: "auth-switch" },
          "Don't have an account? ",
          h("button", {
            className: "auth-switch-link",
            onClick: function() {
              state.error = null;
              state.view = "auth";
              render();
            },
          }, "Create one")
        )
      )
    );
  }

  function renderTokenRevealScreen() {
    return h("div", { className: "auth-screen" },
      h("div", { className: "auth-card" },
        h("div", { className: "auth-brand" },
          h("span", { className: "auth-brand-dot" }),
          h("span", { className: "auth-brand-text" }, "jkbase")
        ),
        h("div", { className: "auth-heading" }, "Account created"),
        h("div", { className: "auth-subtitle" }, "Save your API token for CLI access"),
        h("div", { className: "token-reveal-card" },
          h("div", { className: "token-label" }, "API Token"),
          h("code", { className: "token-value" }, state.revealedToken),
          h("button", { className: "copy-btn", onClick: function() {
            navigator.clipboard.writeText(state.revealedToken);
            this.textContent = "Copied";
            var btn = this;
            setTimeout(function() { btn.textContent = "Copy"; }, 2000);
          }}, "Copy"),
          h("div", { className: "token-warning" },
            "This token provides full API access. Keep it safe. Use it to authenticate the CLI: jkbase login --token YOUR_TOKEN"
          )
        ),
        h("button", {
          className: "btn btn-primary",
          style: "width: 100%; justify-content: center",
          onClick: function() {
            state.revealedToken = null;
            state.view = "projects";
            render();
            loadProjects();
          },
        }, "Continue to Console")
      )
    );
  }

  // --- Projects List ---

  function renderOnboarding() {
    return h("div", { className: "onboarding" },
      h("div", { className: "onboarding-title" }, "Get started with jkbase"),
      h("div", { className: "onboarding-subtitle" }, "Deploy your first project in a few steps"),
      h("ol", { className: "onboarding-steps" },
        h("li", { className: "onboarding-step" },
          h("div", { className: "onboarding-step-content" },
            h("div", { className: "onboarding-step-label" }, "Install the CLI"),
            h("code", { className: "code-block" }, "cargo install jkbase-cli")
          )
        ),
        h("li", { className: "onboarding-step" },
          h("div", { className: "onboarding-step-content" },
            h("div", { className: "onboarding-step-label" }, "Save your token"),
            h("code", { className: "code-block" }, "jkbase login --token YOUR_TOKEN")
          )
        ),
        h("li", { className: "onboarding-step" },
          h("div", { className: "onboarding-step-content" },
            h("div", { className: "onboarding-step-label" }, "Create a project directory"),
            h("div", { className: "onboarding-step-desc" }, "Add a jkbase.toml to your project root")
          )
        ),
        h("li", { className: "onboarding-step" },
          h("div", { className: "onboarding-step-content" },
            h("div", { className: "onboarding-step-label" }, "Deploy"),
            h("code", { className: "code-block" }, "jkbase deploy")
          )
        )
      ),
      h("button", {
        className: "btn btn-primary btn-sm",
        onClick: function() {
          state.showNewProjectModal = true;
          state.error = null;
          render();
        },
      }, "+ New Project")
    );
  }

  function renderProjectTable() {
    return h("table", { className: "project-table" },
      h("thead", null,
        h("tr", null,
          h("th", null, "Name"),
          h("th", null, "Status"),
          h("th", null, "URL")
        )
      ),
      h("tbody", null,
        state.projects.map(function(project) {
          var deployed = project.current_version != null;
          return h("tr", null,
            h("td", null,
              h("button", {
                className: "project-name-link",
                onClick: function() { openProject(project); },
              }, project.name)
            ),
            h("td", null,
              deployed
                ? h("span", { className: "status-deployed" }, "deployed v" + project.current_version)
                : h("span", { className: "status-not-deployed" }, "not deployed")
            ),
            h("td", null,
              project.url
                ? h("a", {
                    className: "project-url-link",
                    href: project.url,
                    target: "_blank",
                    rel: "noopener",
                  }, project.url)
                : h("span", { className: "dim-dash" }, "--")
            )
          );
        })
      )
    );
  }

  function renderProjectsView() {
    return h("div", { className: "app-layout" },
      renderSidebar(),
      h("div", { className: "main-area" },
        h("div", { className: "topbar" },
          h("div", { className: "topbar-title" }, "Projects"),
          h("div", { className: "topbar-actions" },
            h("button", {
              className: "btn btn-primary btn-sm",
              onClick: function() {
                state.showNewProjectModal = true;
                state.error = null;
                render();
              },
            }, "+ New Project")
          )
        ),
        h("div", { className: "content" },
          state.error ? h("div", { className: "error-banner" }, state.error) : null,
          state.loading
            ? h("div", { className: "loading" }, "Loading...")
            : state.projects.length === 0
              ? renderOnboarding()
              : renderProjectTable()
        )
      ),
      state.showNewProjectModal ? renderNewProjectModal() : null
    );
  }

  function renderNewProjectModal() {
    return h("div", { className: "modal-overlay", onClick: function(e) {
      if (e.target === e.currentTarget) {
        state.showNewProjectModal = false;
        state.error = null;
        render();
      }
    }},
      h("div", { className: "modal" },
        h("div", { className: "modal-title" }, "New Project"),
        state.error ? h("div", { className: "error-banner" }, state.error) : null,
        h("form", { className: "modal-form", onSubmit: function(e) {
          e.preventDefault();
          var name = e.target.querySelector("input").value.trim();
          if (name) createProject(name);
        }},
          h("input", {
            className: "input",
            type: "text",
            placeholder: "project-name",
            required: "required",
            autocomplete: "off",
            pattern: "[a-zA-Z0-9][a-zA-Z0-9-]*",
            title: "Letters, numbers, and hyphens",
          }),
          h("div", { className: "modal-actions" },
            h("button", {
              className: "btn btn-secondary",
              type: "button",
              onClick: function() {
                state.showNewProjectModal = false;
                state.error = null;
                render();
              },
            }, "Cancel"),
            h("button", {
              className: "btn btn-primary",
              type: "submit",
              disabled: state.loading ? "disabled" : null,
            }, state.loading ? "Creating..." : "Create")
          )
        )
      )
    );
  }

  // --- Project Detail ---

  function toggleSection(key) {
    state.sectionsOpen[key] = !state.sectionsOpen[key];
    render();
  }

  function renderCollapsibleCard(key, title, headerRight, bodyFn) {
    var isOpen = state.sectionsOpen[key];
    return h("div", { className: "card" },
      h("div", { className: "card-header", onClick: function() { toggleSection(key); } },
        h("div", { className: "card-title" },
          h("span", { className: "card-chevron" + (isOpen ? " open" : "") }, ">"),
          title
        ),
        headerRight || null
      ),
      isOpen ? h("div", { className: "card-body" }, bodyFn()) : null
    );
  }

  function renderDeploySection(project) {
    var deployed = project.current_version != null;
    return renderCollapsibleCard("deploy", "Deploy", null, function() {
      return h("div", null,
        h("div", { className: "section-desc", style: "margin-bottom: 12px" },
          deployed
            ? "Deployed v" + project.current_version
            : "Not deployed"
        ),
        h("div", { className: "section-desc" }, "Deploy or update from your terminal:"),
        h("div", { className: "code-block-row" },
          h("code", { className: "code-block" }, "cd your-project && jkbase deploy"),
          h("button", { className: "copy-btn", onClick: function() {
            navigator.clipboard.writeText("cd your-project && jkbase deploy");
            this.textContent = "Copied";
            var btn = this;
            setTimeout(function() { btn.textContent = "Copy"; }, 2000);
          }}, "Copy")
        )
      );
    });
  }

  function renderSecretsSection(project) {
    var headerBtn = h("button", {
      className: "btn btn-secondary btn-sm",
      onClick: function(e) {
        e.stopPropagation();
        state.showAddSecret = true;
        state.sectionsOpen.secrets = true;
        render();
      },
    }, "Add Secret");

    return renderCollapsibleCard("secrets", "Secrets", headerBtn, function() {
      var items = [];

      if (state.secretsLoading && state.secrets.length === 0) {
        items.push(h("div", { className: "section-desc" }, "Loading secrets..."));
      } else if (state.secrets.length > 0) {
        items.push(
          h("table", { className: "secret-table" },
            h("tbody", null,
              state.secrets.map(function(secret) {
                return h("tr", null,
                  h("td", { className: "secret-key" }, secret.key),
                  h("td", { className: "secret-actions" },
                    h("button", {
                      className: "btn-icon",
                      title: "Delete secret",
                      disabled: state.secretsLoading ? "disabled" : null,
                      onClick: function() {
                        state.deleteSecretConfirm = secret.key;
                        render();
                      },
                    }, "x")
                  )
                );
              })
            )
          )
        );
      } else if (!state.secretsLoading) {
        items.push(h("div", { className: "section-desc" }, "No secrets configured."));
      }

      if (state.deleteSecretConfirm) {
        items.push(
          h("div", { className: "secret-delete-confirm" },
            h("div", { className: "secret-delete-confirm-text" },
              "Delete ",
              h("span", { className: "highlight" }, state.deleteSecretConfirm),
              "?"
            ),
            h("div", { className: "secret-delete-confirm-actions" },
              h("button", { className: "btn btn-secondary btn-sm", onClick: function() {
                state.deleteSecretConfirm = null;
                render();
              }}, "Cancel"),
              h("button", { className: "btn btn-danger btn-sm", onClick: function() {
                deleteSecret(project.id, state.deleteSecretConfirm);
              }}, "Delete")
            )
          )
        );
      }

      if (state.showAddSecret) {
        items.push(
          h("form", { className: "secret-add-form", onSubmit: function(e) {
            e.preventDefault();
            var inputs = e.target.querySelectorAll("input");
            var key = inputs[0].value.trim();
            var value = inputs[1].value;
            if (key && value) addSecret(project.id, key, value);
          }},
            h("input", {
              className: "input",
              type: "text",
              placeholder: "KEY_NAME",
              required: "required",
              autocomplete: "off",
            }),
            h("input", {
              className: "input",
              type: "text",
              placeholder: "secret value",
              required: "required",
              autocomplete: "off",
            }),
            h("button", {
              className: "btn btn-primary btn-sm",
              type: "submit",
              disabled: state.secretsLoading ? "disabled" : null,
            }, state.secretsLoading ? "Saving..." : "Save"),
            h("button", {
              className: "btn btn-secondary btn-sm",
              type: "button",
              onClick: function() {
                state.showAddSecret = false;
                render();
              },
            }, "Cancel")
          )
        );
      }

      return h("div", null, items);
    });
  }

  function renderLogsSection(project) {
    var refreshBtn = h("button", {
      className: "btn btn-secondary btn-sm",
      disabled: state.logsLoading ? "disabled" : null,
      onClick: function(e) {
        e.stopPropagation();
        loadLogs(project.id);
      },
    }, state.logsLoading ? "Loading..." : "Refresh");

    return renderCollapsibleCard("logs", "Logs", refreshBtn, function() {
      if (state.logsLoading && state.logs.length === 0) {
        return h("div", { className: "section-desc" }, "Loading logs...");
      }
      if (state.logs.length === 0) {
        return h("div", { className: "log-empty" }, "No logs yet. Deploy a server container to see logs here.");
      }
      return h("div", { className: "log-container" },
        state.logs.map(function(entry) {
          var streamClass = entry.stream === "stderr" ? "log-stream-stderr" : "log-stream-stdout";
          return h("div", { className: "log-line" },
            h("span", { className: "log-ts" }, "[" + formatTimestamp(entry.timestamp) + "] "),
            h("span", { className: "log-server" }, "[" + entry.server + "] "),
            h("span", { className: streamClass }, entry.line)
          );
        })
      );
    });
  }

  function renderDangerZone(project) {
    return h("div", { className: "danger-zone" },
      h("div", { className: "danger-zone-title" }, "Delete this project"),
      h("div", { className: "danger-zone-desc" },
        "Permanently delete ", h("span", { className: "highlight" }, project.name),
        " and all associated deployments, secrets, and logs. This action cannot be undone."
      ),
      !state.deleteConfirm
        ? h("button", {
            className: "btn btn-danger",
            onClick: function() {
              state.deleteConfirm = true;
              render();
            },
          }, "Delete Project")
        : h("div", { className: "danger-zone-confirm" },
            h("div", { className: "danger-zone-confirm-text" },
              "Are you sure? This will permanently remove all data for this project."
            ),
            h("div", { className: "danger-zone-confirm-actions" },
              h("button", { className: "btn btn-secondary btn-sm", onClick: function() {
                state.deleteConfirm = false;
                render();
              }}, "Cancel"),
              h("button", {
                className: "btn btn-danger-fill btn-sm",
                disabled: state.loading ? "disabled" : null,
                onClick: function() {
                  deleteProject(project.id);
                },
              }, state.loading ? "Deleting..." : "Confirm Delete")
            )
          )
    );
  }

  function renderProjectDetailView() {
    var project = state.currentProject;
    if (!project) return renderProjectsView();

    var deployed = project.current_version != null;

    var titleRow = h("div", { className: "detail-title-row" },
      h("span", null, project.name),
      project.url
        ? h("a", {
            className: "detail-url",
            href: project.url,
            target: "_blank",
            rel: "noopener",
          }, project.url)
        : null
    );

    return h("div", { className: "app-layout" },
      renderSidebar(),
      h("div", { className: "main-area" },
        h("div", { className: "topbar" },
          h("div", { className: "topbar-title" }, titleRow),
          h("div", { className: "topbar-actions" },
            h("div", { className: "breadcrumb" },
              h("button", {
                className: "breadcrumb-link",
                onClick: function() { navTo("projects"); },
              }, "Projects"),
              h("span", { className: "breadcrumb-sep" }, "/"),
              h("span", { className: "breadcrumb-current" }, project.name)
            )
          )
        ),
        h("div", { className: "content" },
          state.error ? h("div", { className: "error-banner" }, state.error) : null,
          state.success ? h("div", { className: "success-banner" }, state.success) : null,
          renderDeploySection(project),
          renderSecretsSection(project),
          renderLogsSection(project),
          renderDangerZone(project)
        )
      )
    );
  }

  // --- Account View ---

  function renderAccountView() {
    return h("div", { className: "app-layout" },
      renderSidebar(),
      h("div", { className: "main-area" },
        h("div", { className: "topbar" },
          h("div", { className: "topbar-title" }, "Account")
        ),
        h("div", { className: "content" },
          state.accountError ? h("div", { className: "error-banner" }, state.accountError) : null,
          state.accountSuccess ? h("div", { className: "success-banner" }, state.accountSuccess) : null,

          // Profile
          h("div", { className: "card" },
            h("div", { className: "card-static" },
              h("div", { className: "card-title", style: "margin-bottom: 14px" }, "Profile"),
              h("div", { className: "account-field-label" }, "Email"),
              h("div", { className: "account-field-value" }, state.email || "")
            )
          ),

          // API Token
          h("div", { className: "card" },
            h("div", { className: "card-static" },
              h("div", { className: "card-title", style: "margin-bottom: 14px" }, "API Token"),
              h("div", { className: "section-desc", style: "margin-bottom: 14px" },
                "Generate a new API token. This will replace your current token."
              ),
              state.revealedToken
                ? h("div", null,
                    h("div", { className: "token-label" }, "Your new API token"),
                    h("code", { className: "token-value" }, state.revealedToken),
                    h("button", { className: "copy-btn", onClick: function() {
                      navigator.clipboard.writeText(state.revealedToken);
                      this.textContent = "Copied";
                      var btn = this;
                      setTimeout(function() { btn.textContent = "Copy"; }, 2000);
                    }}, "Copy"),
                    h("div", { className: "token-warning" },
                      "This token provides full API access. Keep it safe. Your previous token is no longer valid."
                    )
                  )
                : h("button", {
                    className: "btn btn-secondary",
                    disabled: state.accountLoading ? "disabled" : null,
                    onClick: generateToken,
                  }, state.accountLoading ? "Generating..." : "Generate New Token")
            )
          ),

          // Change Password
          h("div", { className: "card" },
            h("div", { className: "card-static" },
              h("div", { className: "card-title", style: "margin-bottom: 14px" }, "Change Password"),
              h("form", { className: "account-form", onSubmit: function(e) {
                e.preventDefault();
                var inputs = e.target.querySelectorAll("input");
                var current = inputs[0].value;
                var next = inputs[1].value;
                if (current && next) {
                  changePassword(current, next);
                  inputs[0].value = "";
                  inputs[1].value = "";
                }
              }},
                h("input", {
                  className: "input",
                  type: "password",
                  placeholder: "Current password",
                  required: "required",
                  autocomplete: "current-password",
                  disabled: state.accountLoading ? "disabled" : null,
                }),
                h("input", {
                  className: "input",
                  type: "password",
                  placeholder: "New password (8+ characters)",
                  required: "required",
                  minlength: "8",
                  autocomplete: "new-password",
                  disabled: state.accountLoading ? "disabled" : null,
                }),
                h("div", null,
                  h("button", {
                    className: "btn btn-primary",
                    type: "submit",
                    disabled: state.accountLoading ? "disabled" : null,
                  }, state.accountLoading ? "Updating..." : "Update Password")
                )
              )
            )
          )
        )
      )
    );
  }

  // --- Main Render ---

  function render() {
    app.innerHTML = "";
    var view;
    switch (state.view) {
      case "loading":
        view = h("div", { className: "auth-screen" },
          h("div", { className: "loading" }, "Loading...")
        );
        break;
      case "auth":
        view = renderAuthScreen();
        break;
      case "auth-signin":
        view = renderSignInScreen();
        break;
      case "token-reveal":
        view = renderTokenRevealScreen();
        break;
      case "projects":
        view = renderProjectsView();
        break;
      case "project-detail":
        view = renderProjectDetailView();
        break;
      case "account":
        view = renderAccountView();
        break;
      default:
        view = renderProjectsView();
    }
    app.appendChild(view);

    // Auto-focus first visible input
    var firstInput = app.querySelector("input:not([disabled])");
    if (firstInput && document.activeElement && !document.activeElement.matches("input")) {
      firstInput.focus();
    }
  }

  // --- Init ---

  if (state.token) {
    state.view = "loading";
    render();
    verifyToken();
  } else {
    state.view = "auth";
    render();
  }
})();
</script>
</body>
</html>
