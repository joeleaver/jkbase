<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jkbase console</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #08080c;
  --bg-sidebar: #0c0c14;
  --bg-card: #0f0f18;
  --bg-input: #0a0a12;
  --bg-code: #060610;
  --border: #1a1a28;
  --border-hover: #2a2a48;
  --text: #e0e0e8;
  --text-dim: #6e6e80;
  --accent: #00d4ff;
  --accent-hover: #33dfff;
  --accent-dim: rgba(0, 212, 255, 0.08);
  --danger: #ff4466;
  --danger-hover: #ff6680;
  --danger-dim: rgba(255, 68, 102, 0.08);
  --success: #00cc88;
  --success-dim: rgba(0, 204, 136, 0.08);
  --warning: #ffaa00;
  --mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
  --sidebar-w: 240px;
  --transition: 150ms ease;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* --- Focus States --- */

*:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- Buttons --- */

.btn {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  line-height: 1.4;
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--border-hover);
  background: rgba(255, 255, 255, 0.03);
}

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  padding: 6px 12px;
  border: none;
}

.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.btn-danger-fill {
  background: var(--danger);
  color: #fff;
  font-weight: 600;
}

.btn-danger-fill:hover:not(:disabled) {
  background: var(--danger-hover);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(255, 68, 102, 0.25);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-dim);
  border-color: var(--danger);
}

.btn-sm {
  font-size: 12px;
  padding: 5px 10px;
}

.btn-icon {
  padding: 4px 8px;
  font-size: 14px;
  line-height: 1;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 4px;
  transition: all var(--transition);
}

.btn-icon:hover {
  color: var(--danger);
  background: var(--danger-dim);
}

/* --- Inputs --- */

.input {
  font-family: var(--mono);
  font-size: 13px;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  outline: none;
  transition: border-color var(--transition);
  width: 100%;
}

.input.input-sm {
  padding: 6px 10px;
  font-size: 12px;
  width: auto;
}

.input:focus {
  border-color: var(--border-hover);
}

.input::placeholder {
  color: var(--text-dim);
}

/* --- Sidebar Layout --- */

.app-layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform 200ms ease;
}

.sidebar-brand {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-brand-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.sidebar-brand-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* --- Project Selector Dropdown --- */

.project-selector {
  position: relative;
  margin: 0 12px 12px;
}

.project-selector-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  gap: 8px;
  min-width: 0;
}

.project-selector-trigger:hover {
  border-color: var(--border-hover);
}

.project-selector-trigger.open {
  border-color: var(--accent);
}

.project-selector-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.project-selector-placeholder {
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.project-selector-chevron {
  color: var(--text-dim);
  font-size: 10px;
  flex-shrink: 0;
  transition: transform var(--transition);
}

.project-selector-chevron.open {
  transform: rotate(180deg);
}

.project-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  z-index: 110;
  max-height: 280px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.project-dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  border: none;
  background: transparent;
  text-align: left;
  transition: background var(--transition);
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.project-dropdown-item:hover {
  background: rgba(255, 255, 255, 0.04);
}

.project-dropdown-item.active {
  background: var(--accent-dim);
}

.project-dropdown-item-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.project-dropdown-badge {
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.project-dropdown-badge.deployed {
  color: var(--success);
}

.project-dropdown-divider {
  height: 1px;
  background: var(--border);
  margin: 0;
  flex-shrink: 0;
}

.project-dropdown-new {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  border: none;
  background: transparent;
  text-align: left;
  transition: background var(--transition);
  width: 100%;
  flex-shrink: 0;
}

.project-dropdown-new:hover {
  background: var(--accent-dim);
}

/* --- Sidebar Feature Nav --- */

.sidebar-nav {
  flex: 1;
  padding: 0 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}

.sidebar-nav-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 12px 12px 6px;
}

.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: var(--mono);
  width: 100%;
  text-align: left;
  transition: all var(--transition);
}

.sidebar-nav-item:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.sidebar-nav-item.active {
  color: var(--accent);
  background: var(--accent-dim);
}

.sidebar-nav-icon {
  font-size: 12px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
  color: inherit;
  opacity: 0.7;
}

.sidebar-nav-item.active .sidebar-nav-icon {
  opacity: 1;
}

.sidebar-empty-prompt {
  padding: 16px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}

.sidebar-bottom {
  padding: 16px;
  border-top: 1px solid var(--border);
}

.sidebar-email {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-signout {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  transition: color var(--transition);
}

.sidebar-signout:hover {
  color: var(--text);
}

/* Mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 99;
}

.hamburger {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 101;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 10px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1;
}

.main-area {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 16px;
}

.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* --- Profile Icon --- */

.profile-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #1a1a2e;
  border: 1px solid #2a2a4e;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color var(--transition);
  flex-shrink: 0;
}

.profile-icon:hover {
  border-color: var(--accent);
}

.profile-icon-letter {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  font-family: var(--mono);
  text-transform: uppercase;
  line-height: 1;
  user-select: none;
}

/* --- Cards / Sections --- */

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
  gap: 12px;
}

.card-header:hover {
  background: rgba(255, 255, 255, 0.015);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-chevron {
  color: var(--text-dim);
  font-size: 11px;
  transition: transform var(--transition);
  flex-shrink: 0;
}

.card-chevron.open {
  transform: rotate(90deg);
}

.card-body {
  padding: 0 20px 18px;
}

.card-static {
  padding: 18px 20px;
}

/* --- Status dots --- */

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.green {
  background: var(--success);
}

.status-dot.red {
  background: var(--danger);
}

.status-dot.yellow {
  background: var(--warning);
}

/* --- Overview stats --- */

.overview-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.stat-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* --- VM Status --- */

.vm-status-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.vm-status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.vm-status-label {
  font-size: 12px;
  color: var(--text-dim);
  min-width: 100px;
}

.vm-status-value {
  font-size: 13px;
  color: var(--text);
}

/* --- Hosting --- */

.hosting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.hosting-row:last-of-type {
  border-bottom: none;
}

.hosting-row.dim {
  color: var(--text-dim);
}

.hosting-label {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 60px;
  letter-spacing: 0.5px;
}

.hosting-url {
  color: var(--accent);
  text-decoration: none;
}

.hosting-url:hover {
  text-decoration: underline;
}

.btn-danger-text {
  color: var(--danger) !important;
}

.domain-add-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: center;
}

.domain-add-form .input {
  width: 180px;
  flex: none;
}

.domain-suffix {
  font-size: 13px;
  color: var(--text-dim);
  margin-right: 4px;
}

.hosting-info {
  margin-top: 20px;
  padding: 16px;
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.hosting-info-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.hosting-info-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 12px;
}

/* --- Functions list --- */

.function-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
}

.function-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.function-route {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: auto;
}

/* --- Server cards --- */

.server-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

.server-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.server-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.server-port {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: 4px;
}

.server-badges {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}

.server-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-dim);
}

.server-logs-area {
  padding: 12px;
}

.server-logs-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.server-logs-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* --- Secrets --- */

.secret-table {
  width: 100%;
  border-collapse: collapse;
}

.secret-table td {
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid rgba(26, 26, 40, 0.5);
}

.secret-table tr:last-child td {
  border-bottom: none;
}

.secret-key {
  color: var(--text);
}

.secret-actions {
  text-align: right;
  width: 40px;
}

.secret-add-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: flex-start;
}

.secret-add-form .input {
  flex: 1;
}

.secret-delete-confirm {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--danger-dim);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.secret-delete-confirm-text {
  font-size: 12px;
  color: var(--text);
}

.secret-delete-confirm-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

/* --- Logs --- */

.log-container {
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.7;
}

.log-line {
  white-space: pre-wrap;
  word-break: break-all;
}

.log-ts {
  color: var(--text-dim);
}

.log-server {
  color: #aa88ff;
}

.log-stream-stdout {
  color: var(--text);
}

.log-stream-stderr {
  color: var(--danger);
}

.log-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
}

/* --- Danger Zone --- */

.danger-zone {
  background: var(--bg-card);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 8px;
  padding: 18px 20px;
  margin-top: 16px;
}

.danger-zone-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--danger);
  margin-bottom: 8px;
}

.danger-zone-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 14px;
  line-height: 1.5;
}

.danger-zone-confirm {
  margin-top: 12px;
  padding: 12px 14px;
  background: rgba(255, 68, 102, 0.06);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 6px;
}

.danger-zone-confirm-text {
  font-size: 12px;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.5;
}

.danger-zone-confirm-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* --- Settings --- */

.settings-field {
  margin-bottom: 20px;
}

.settings-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}

.settings-value {
  font-size: 13px;
  color: var(--text);
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  user-select: all;
}

/* --- Onboarding --- */

.onboarding {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 40px 32px;
  text-align: center;
  max-width: 560px;
  margin: 40px auto 0;
}

.onboarding-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.onboarding-subtitle {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 32px;
}

.onboarding-steps {
  list-style: none;
  counter-reset: steps;
  display: flex;
  flex-direction: column;
  gap: 20px;
  text-align: left;
  margin-bottom: 28px;
}

.onboarding-step {
  counter-increment: steps;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.onboarding-step::before {
  content: counter(steps);
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin-top: 1px;
}

.onboarding-step-content {
  flex: 1;
  min-width: 0;
}

.onboarding-step-label {

<body>

<div id="app"></div>

<script>
(function() {
  "use strict";

  var API = "https://api.jkbase.app";
  var TOKEN_KEY = "jkbase_token";
  var EMAIL_KEY = "jkbase_email";

  var app = document.getElementById("app");

  // --- State ---
  var state = {
    token: localStorage.getItem(TOKEN_KEY) || null,
    email: localStorage.getItem(EMAIL_KEY) || null,
    view: "loading",
    // views: loading, auth, auth-signin, token-reveal, console, account
    projects: [],
    loading: false,
    error: null,
    success: null,
    showNewProjectModal: false,
    deleteConfirm: false,
    revealedToken: null,
    // project detail
    currentProject: null,
    projectTab: "overview", // overview, hosting, functions, servers, secrets, settings
    projectStatus: null,
    statusLoading: false,
    secrets: [],
    logs: [],
    secretsLoading: false,
    logsLoading: false,
    logsFollow: false,
    logsCursor: 0,
    logsLimit: 200,
    logsErrorsOnly: false,
    showAddSecret: false,
    deleteSecretConfirm: null,
    // account
    accountLoading: false,
    accountError: null,
    accountSuccess: null,
    // sidebar mobile
    sidebarOpen: false,
    // project dropdown
    dropdownOpen: false,
    // domains
    domains: [],
    domainsLoading: false,
    showAddDomain: false,
    domainBusy: null,       // host currently being verified/removed
    domainError: null,      // inline verification error
    // deployments
    deployments: [],
    deploymentsLoading: false,
    rollbackConfirm: null,  // version awaiting rollback confirmation
    rollbackBusy: false,
  };

  // --- API helpers ---

  function api(method, path, body) {
    var headers = { "Content-Type": "application/json" };
    if (state.token) {
      headers["Authorization"] = "Bearer " + state.token;
    }
    var opts = { method: method, headers: headers };
    if (body) {
      opts.body = JSON.stringify(body);
    }
    return fetch(API + path, opts).then(function(res) {
      if (res.status === 401) {
        logout();
        throw new Error("Session expired. Please sign in again.");
      }
      if (res.status === 204) {
        return null;
      }
      return res.json().then(function(data) {
        if (!res.ok) {
          throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
        }
        return data;
      });
    });
  }

  // --- Auth ---

  function logout() {
    state.token = null;
    state.email = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMAIL_KEY);
    state.view = "auth";
    state.projects = [];
    state.currentProject = null;
    state.error = null;
    state.success = null;
    state.sidebarOpen = false;
    state.dropdownOpen = false;
    render();
  }

  function verifyToken() {
    api("GET", "/me").then(function(me) {
      state.email = me.email;
      localStorage.setItem(EMAIL_KEY, me.email);
      state.view = "console";
      render();
      loadProjects();
    }).catch(function() {
      state.token = null;
      localStorage.removeItem(TOKEN_KEY);
      state.view = "auth";
      render();
    });
  }

  function doRegister(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/register", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "token-reveal";
      state.revealedToken = data.token;
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function doLogin(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/login", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "console";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Projects ---

  function loadProjects() {
    state.loading = true;
    state.error = null;
    render();
    api("GET", "/projects").then(function(projects) {
      state.projects = projects;
      state.loading = false;
      // If we had a current project, update its data from the fresh list
      if (state.currentProject) {
        var updated = projects.filter(function(p) { return p.id === state.currentProject.id; })[0];
        if (updated) {
          state.currentProject = updated;
        } else {
          // Project was deleted
          state.currentProject = null;
          state.projectTab = "overview";
        }
      }
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function createProject(name) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/projects", { name: name }).then(function() {
      state.showNewProjectModal = false;
      state.loading = false;
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteProject(id) {
    state.error = null;
    state.deleteConfirm = false;
    state.loading = true;
    render();
    api("DELETE", "/projects/" + id).then(function() {
      state.loading = false;
      state.currentProject = null;
      state.projectTab = "overview";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Project Detail ---

  function openProject(project) {
    state.currentProject = project;
    state.view = "console";
    state.projectTab = "overview";
    state.projectStatus = null;
    state.statusLoading = false;
    state.secrets = [];
    state.logs = [];
    state.logsFollow = false;
    state.logsCursor = 0;
    state.domains = [];
    state.domainBusy = null;
    state.domainError = null;
    state.deployments = [];
    state.rollbackConfirm = null;
    state.rollbackBusy = false;
    state.error = null;
    state.success = null;
    state.showAddSecret = false;
    state.showAddDomain = false;
    state.deleteSecretConfirm = null;
    state.deleteConfirm = false;
    state.dropdownOpen = false;
    state.sidebarOpen = false;
    render();
    // Fetch all data in parallel
    loadStatus(project.id);
    loadSecrets(project.id);
    loadDomains(project.id);
    loadDeployments(project.id);
    loadLogs(project.id);
  }

  function setProjectTab(tab) {
    state.projectTab = tab;
    state.error = null;
    state.success = null;
    state.sidebarOpen = false;
    render();
  }

  function loadStatus(projectId) {
    state.statusLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/status").then(function(status) {
      state.projectStatus = status;
      state.statusLoading = false;
      render();
    }).catch(function(e) {
      state.projectStatus = null;
      state.statusLoading = false;
      render();
    });
  }

  function loadSecrets(projectId) {
    state.secretsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/secrets").then(function(secrets) {
      state.secrets = secrets;
      state.secretsLoading = false;
      render();
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function addSecret(projectId, key, value) {
    state.error = null;
    state.secretsLoading = true;
    render();
    api("POST", "/projects/" + projectId + "/secrets", { key: key, value: value }).then(function() {
      state.showAddSecret = false;
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteSecret(projectId, key) {
    state.error = null;
    state.deleteSecretConfirm = null;
    state.secretsLoading = true;
    render();
    api("DELETE", "/projects/" + projectId + "/secrets/" + encodeURIComponent(key)).then(function() {
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function scrollLogsToBottom() {
    var logEls = document.querySelectorAll(".log-container");
    for (var i = 0; i < logEls.length; i++) {
      logEls[i].scrollTop = logEls[i].scrollHeight;
    }
  }

  // Full (re)load: replaces the buffer and resets the tail cursor.
  function loadLogs(projectId) {
    state.logsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/logs?limit=" + state.logsLimit).then(function(logs) {
      state.logs = logs || [];
      state.logsCursor = state.logs.length ? state.logs[state.logs.length - 1].seq : 0;
      state.logsLoading = false;
      render();
      scrollLogsToBottom();
    }).catch(function(e) {
      state.logsLoading = false;
      state.error = e.message;
      render();
    });
  }

  // Incremental tail: fetch only lines newer than the cursor and append them.
  // Driven by the global poll loop while "Follow" is on. Stays quiet on errors
  // so a transient blip (e.g. VM waking) doesn't disrupt the view.
  var LOGS_MAX_BUFFER = 2000;
  function tailLogs(projectId) {
    api("GET", "/projects/" + projectId + "/logs?since=" + state.logsCursor).then(function(logs) {
      if (!logs || !logs.length) return;
      state.logs = state.logs.concat(logs);
      if (state.logs.length > LOGS_MAX_BUFFER) {
        state.logs = state.logs.slice(state.logs.length - LOGS_MAX_BUFFER);
      }
      state.logsCursor = logs[logs.length - 1].seq;
      render();
      scrollLogsToBottom();
    }).catch(function() {});
  }

  function toggleLogsFollow(projectId) {
    state.logsFollow = !state.logsFollow;
    render();
    if (state.logsFollow) {
      // Reconcile immediately so the user sees fresh lines without waiting a tick.
      tailLogs(projectId);
    }
  }

  // Single global loop: cheap no-op unless the user is actively following logs on
  // the Servers tab. Avoids per-view interval setup/teardown bookkeeping.
  function startLogTailLoop() {
    setInterval(function() {
      if (state.logsFollow &&
          state.view === "console" &&
          state.projectTab === "servers" &&
          state.currentProject) {
        tailLogs(state.currentProject.id);
      }
    }, 2000);
  }

  // --- Domains ---

  function loadDomains(projectId, silent) {
    if (!silent) {
      state.domainsLoading = true;
      render();
    }
    api("GET", "/projects/" + projectId + "/domains").then(function(domains) {
      state.domains = domains || [];
      state.domainsLoading = false;
      render();
    }).catch(function(e) {
      state.domainsLoading = false;
      if (!silent) { state.error = e.message; }
      render();
    });
  }

  // Poll quietly while any custom domain's cert is still provisioning so the
  // HTTPS indicator flips to active without a manual refresh.
  function startDomainPollLoop() {
    setInterval(function() {
      if (state.view === "console" &&
          state.projectTab === "domains" &&
          state.currentProject &&
          state.domains.some(function(d) { return d.tls === "provisioning"; })) {
        loadDomains(state.currentProject.id, true);
      }
    }, 8000);
  }

  function addDomain(projectId, domain, site) {
    state.error = null;
    var body = { domain: domain };
    if (site) body.site = site;
    api("POST", "/projects/" + projectId + "/domains", body).then(function() {
      state.showAddDomain = false;
      loadDomains(projectId);
    }).catch(function(e) {
      state.error = e.message;
      render();
    });
  }

  function verifyDomain(projectId, host) {
    state.domainBusy = host;
    state.domainError = null;
    render();
    api("POST", "/projects/" + projectId + "/domains/" + encodeURIComponent(host) + "/verify")
      .then(function() {
        state.domainBusy = null;
        loadDomains(projectId);
      })
      .catch(function(e) {
        state.domainBusy = null;
        state.domainError = { host: host, message: e.message };
        render();
      });
  }

  function removeDomain(projectId, host) {
    state.error = null;
    state.domainBusy = host;
    render();
    api("DELETE", "/projects/" + projectId + "/domains/" + encodeURIComponent(host)).then(function() {
      state.domainBusy = null;
      loadDomains(projectId);
    }).catch(function(e) {
      state.domainBusy = null;
      state.error = e.message;
      render();
    });
  }

  // --- Rendering ---

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      var keys = Object.keys(attrs);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === "className") {
          el.className = v;
        } else if (k === "htmlFor") {
          el.setAttribute("for", v);
        } else {
          el.setAttribute(k, v);
        }
      }
    }
    for (var a = 2; a < arguments.length; a++) {
      var child = arguments[a];
      if (child == null || child === false) continue;
      if (typeof child === "string" || typeof child === "number") {
        el.appendChild(document.createTextNode(child));
      } else if (Array.isArray(child)) {
        for (var j = 0; j < child.length; j++) {
          if (child[j] != null && child[j] !== false) el.appendChild(child[j]);
        }
      } else {
        el.appendChild(child);
      }
    }
    return el;
  }

  function formatTimestamp(ts) {
    try {
      // Log timestamps are unix seconds; Date expects milliseconds.
      var d = new Date(ts * 1000);
      var hh = String(d.getHours()).padStart(2, "0");
      var mm = String(d.getMinutes()).padStart(2, "0");
      var ss = String(d.getSeconds()).padStart(2, "0");
      return hh + ":" + mm + ":" + ss;
    } catch (e) {
      return ts;
    }
  }

  function renderDomainItem(project, d) {
    var isCustom = d.kind === "custom";
    var href = isCustom ? "https://" + d.host : "https://" + d.host + ".jkbase.app";
    var label = isCustom ? d.host : d.host + ".jkbase.app";
    var busy = state.domainBusy === d.host;

    var tlsChip = null;
    if (d.tls === "active") {
      tlsChip = h("span", { className: "badge badge-active" }, "HTTPS");
    } else if (d.tls === "provisioning") {
      tlsChip = h("span", { className: "badge badge-pending" }, "HTTPS provisioning");
    }

    var head = h("div", { className: "domain-head" },
      h("a", { className: "domain-host", href: href, target: "_blank", rel: "noopener" }, label),
      h("span", { className: "badge" }, d.kind),
      d.status === "active"
        ? h("span", { className: "badge badge-active" }, "active")
        : h("span", { className: "badge badge-pending" }, "pending verification"),
      tlsChip,
      d.site ? h("span", { className: "domain-site" }, "site ", h("code", null, d.site)) : null,
      h("span", { className: "domain-spacer" }),
      h("div", { className: "domain-actions" },
        h("button", {
          className: "btn btn-ghost btn-sm btn-danger-text",
          disabled: busy ? "disabled" : null,
          onClick: function() { removeDomain(project.id, d.host); },
        }, "Remove")
      )
    );

    var challenge = null;
    if (d.status === "pending" && d.verification) {
      var err = state.domainError && state.domainError.host === d.host
        ? h("span", { className: "dns-error" }, state.domainError.message)
        : null;
      challenge = h("div", { className: "dns-challenge" },
        h("div", { className: "dns-challenge-title" }, "Verify domain ownership"),
        h("div", { className: "dns-challenge-desc" },
          "Add this TXT record at your DNS provider, then click Verify."
        ),
        dnsField("Type", "TXT", false),
        dnsField("Name", d.verification.record, true),
        dnsField("Value", d.verification.value, true),
        h("div", { className: "dns-challenge-actions" },
          h("button", {
            className: "btn btn-primary btn-sm",
            disabled: busy ? "disabled" : null,
            onClick: function() { verifyDomain(project.id, d.host); },
          }, busy ? "Verifying..." : "Verify"),
          err
        )
      );
    } else if (d.tls === "provisioning") {
      challenge = h("div", { className: "domain-hint" },
        "Point this domain's A record at the platform — an HTTPS certificate is issued automatically (usually within a few minutes)."
      );
    }

    return h("div", { className: "domain-item" }, head, challenge);
  }

        var inputs = e.target.querySelectorAll("input");

    },
      h("input", {
        className: "input input-sm",

            h("div", { className: "card-title" }, "Domains"),

  // Deployments
  function renderDeploymentsView(project) {
    var rows = state.deployments.map(function(d) {
      var actions;
      if (d.active) {
        actions = h("span", { className: "badge badge-active" }, "active");
      } else if (state.rollbackConfirm === d.version) {
        actions = h("div", { className: "domain-actions" },
          h("button", {
            className: "btn btn-secondary btn-sm",
            onClick: function() { state.rollbackConfirm = null; render(); },
          }, "Cancel"),
          h("button", {
            className: "btn btn-primary btn-sm",

          }, state.rollbackBusy ? "Rolling back..." : "Confirm rollback")
        );
      } else {
        actions = h("button", {
          className: "btn btn-secondary btn-sm",
          onClick: function() { state.rollbackConfirm = d.version; render(); },
        }, "Roll back");
      }
      return h("div", { className: "deploy-item" },
        h("span", { className: "deploy-version" }, "v" + d.version),
        h("span", { className: "deploy-time" }, humanAge(d.created_at)),

    var body;

    return h("div", { className: "feature-content-inner" },

          h("div", { className: "card-title", style: "margin-bottom: 6px" }, "Deployment history"),
          h("div", { className: "section-desc", style: "margin-bottom: 6px" },

          ),

  function humanAge(ts) {
    if (!ts) return "";
    var secs = Math.floor(Date.now() / 1000) - ts;
    if (secs < 0) secs = 0;
    if (secs < 60) return secs + "s ago";
    if (secs < 3600) return Math.floor(secs / 60) + "m ago";
    if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
    return Math.floor(secs / 86400) + "d ago";
  }

  // Functions
  function renderFunctionsView(project) {
    var status = state.projectStatus;
    var functions = status ? (status.functions_loaded || []) : [];

    return h("div", { className: "feature-content-inner" },

      state.statusLoading
        ? h("div", { className: "loading" }, "Loading functions...")
        : functions.length > 0

              h("div", { className: "section-desc", style: "margin-bottom: 16px" },

                  h("span", { className: "function-route" }, "/functions/" + name)

  // Servers
  function renderServersView(project) {
    var status = state.projectStatus;
    var servers = status ? (status.servers || []) : [];

    return h("div", { className: "feature-content-inner" },

      state.statusLoading
        ? h("div", { className: "loading" }, "Loading servers...")
        : servers.length > 0
          ? h("div", null,
              h("div", { className: "section-desc", style: "margin-bottom: 16px" },
                String(servers.length) + " server container" + (servers.length !== 1 ? "s" : "")
              ),
              h("div", { className: "server-logs-toolbar", style: "margin-bottom: 16px" },
                h("button", {
                  className: "btn btn-sm " + (state.logsFollow ? "btn-primary" : "btn-secondary"),
                  onClick: function() { toggleLogsFollow(project.id); },
                }, state.logsFollow ? "● Following" : "Follow logs"),
                h("button", {
                  className: "btn btn-secondary btn-sm",
                  disabled: state.logsLoading ? "disabled" : null,
                  onClick: function() { loadLogs(project.id); },
                }, state.logsLoading ? "Loading..." : "Refresh"),
                h("label", { className: "server-logs-label", style: "margin-left: 8px" }, "Lines"),
                h("select", {
                  className: "btn btn-secondary btn-sm",
                  onChange: function(e) {
                    state.logsLimit = parseInt(e.target.value, 10) || 200;
                    loadLogs(project.id);
                  },
                },
                  [100, 200, 500, 1000].map(function(n) {
                    return h("option",
                      n === state.logsLimit ? { value: String(n), selected: "selected" } : { value: String(n) },
                      String(n));
                  })
                ),
                h("button", {
                  className: "btn btn-sm " + (state.logsErrorsOnly ? "btn-primary" : "btn-secondary"),
                  style: "margin-left: 8px",
                  onClick: function() { state.logsErrorsOnly = !state.logsErrorsOnly; render(); },
                }, "Errors only")
              ),
              servers.map(function(server) {
                // Filter logs for this server (and optionally to stderr only)
                var serverLogs = state.logs.filter(function(log) {
                  if (log.server !== server.name) return false;
                  if (state.logsErrorsOnly && log.stream !== "stderr") return false;
                  return true;
                });

                return h("div", { className: "server-card" },
                  h("div", { className: "server-card-header" },
                    h("span", { className: "server-name" }, server.name),
                    h("span", { className: "server-port" }, ":" + server.port),
                    h("div", { className: "server-badges" },
                      h("span", { className: "server-badge" },
                        h("span", { className: "status-dot " + (server.running ? "green" : "red") }),
                        server.running ? "running" : "stopped"
                      ),
                      h("span", { className: "server-badge" },
                        h("span", { className: "status-dot " + (server.healthy ? "green" : server.healthy === false ? "red" : "yellow") }),
                        server.healthy ? "healthy" : server.healthy === false ? "unhealthy" : "unknown"
                      )
                    )
                  ),
                  h("div", { className: "server-logs-area" },
                    h("div", { className: "server-logs-toolbar" },
                      h("span", { className: "server-logs-label" }, "Logs")
                    ),
                    serverLogs.length > 0
                      ? h("div", { className: "log-container" },
                          serverLogs.map(function(entry) {
                            var streamClass = entry.stream === "stderr" ? "log-stream-stderr" : "log-stream-stdout";
                            return h("div", { className: "log-line" },
                              h("span", { className: "log-ts" }, "[" + formatTimestamp(entry.timestamp) + "] "),
                              h("span", { className: streamClass }, entry.line)
                            );
                          })
                        )
                      : h("div", { className: "log-empty" }, "No logs for this server.")
                  )
                );
              })
            )
          : h("div", { className: "empty-state" },
              h("div", { className: "empty-state-title" }, "No server containers"),
              h("div", { className: "empty-state-desc" },
                "Servers are long-running processes defined in your jkbase.toml. They get their own port, health checks, and log streams. Deploy with the CLI to see them here."
              ),
              h("code", { className: "code-block", style: "max-width: 360px; margin: 16px auto 0; text-align: left" },
                "[[servers]]\nname = \"api\"\ncommand = \"node server.js\"\nport = 3000"
              )
            )
    );
  }

                  h("button", {
                    className: "btn-icon",

    if (state.showAddSecret) {

      h("div", { className: "card" },
        h("div", { className: "card-static" },

              h("div", { className: "card-title", style: "margin-bottom: 14px" }, "API Token"),
              h("div", { className: "section-desc", style: "margin-bottom: 14px" },
                "Generate a new API token. This will replace your current token."
              ),
              state.revealedToken
                ? h("div", null,
                    h("div", { className: "token-label" }, "Your new API token"),
                    h("code", { className: "token-value" }, state.revealedToken),
                    h("button", { className: "copy-btn", onClick: function() {
                      navigator.clipboard.writeText(state.revealedToken);
                      this.textContent = "Copied";
                      var btn = this;
                      setTimeout(function() { btn.textContent = "Copy"; }, 2000);
                    }}, "Copy"),
                    h("div", { className: "token-warning" },
                      "This token provides full API access. Keep it safe. Your previous token is no longer valid."
                    )
                  )
                : h("button", {
                    className: "btn btn-secondary",
                    disabled: state.accountLoading ? "disabled" : null,
                    onClick: generateToken,
                  }, state.accountLoading ? "Generating..." : "Generate New Token")
            )
          ),

          // Change Password
          h("div", { className: "card" },
            h("div", { className: "card-static" },
              h("div", { className: "card-title", style: "margin-bottom: 14px" }, "Change Password"),
              h("form", { className: "account-form", onSubmit: function(e) {
                e.preventDefault();
                var inputs = e.target.querySelectorAll("input");
                var current = inputs[0].value;
                var next = inputs[1].value;
                if (current && next) {
                  changePassword(current, next);
                  inputs[0].value = "";
                  inputs[1].value = "";
                }
              }},
                h("input", {
                  className: "input",
                  type: "password",
                  placeholder: "Current password",
                  required: "required",
                  autocomplete: "current-password",
                  disabled: state.accountLoading ? "disabled" : null,
                }),
                h("input", {
                  className: "input",
                  type: "password",
                  placeholder: "New password (8+ characters)",
                  required: "required",
                  minlength: "8",
                  autocomplete: "new-password",
                  disabled: state.accountLoading ? "disabled" : null,
                }),
                h("div", null,
                  h("button", {
                    className: "btn btn-primary",
                    type: "submit",
                    disabled: state.accountLoading ? "disabled" : null,
                  }, state.accountLoading ? "Updating..." : "Update Password")
                )
              )
            )
          )
        )
      )
    );
  }

  // --- Main Render ---

  function render() {
    app.innerHTML = "";
    var view;
    switch (state.view) {
      case "loading":
        view = h("div", { className: "auth-screen" },
          h("div", { className: "loading" }, "Loading...")
        );
        break;
      case "auth":
        view = renderAuthScreen();
        break;
      case "auth-signin":
        view = renderSignInScreen();
        break;
      case "token-reveal":
        view = renderTokenRevealScreen();
        break;
      case "console":
        view = renderConsoleView();
        break;
      case "account":
        view = renderAccountView();
        break;
      default:
        view = renderConsoleView();
    }
    app.appendChild(view);

    // Auto-focus first visible input
    var firstInput = app.querySelector("input:not([disabled])");
    if (firstInput && document.activeElement && !document.activeElement.matches("input")) {
      firstInput.focus();
    }
  }

  // --- Init ---

  startLogTailLoop();
  startDomainPollLoop();

  if (state.token) {
    state.view = "loading";
    render();
    verifyToken();
  } else {
    state.view = "auth";
    render();
  }
})();
</script>
</body>
</html>
