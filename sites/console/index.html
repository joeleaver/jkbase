<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jkbase console</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0f;
  --bg-raised: #111118;
  --bg-input: #0d0d14;
  --border: #1a1a2e;
  --border-hover: #2a2a4e;
  --text: #e0e0e8;
  --text-dim: #888899;
  --accent: #00d4ff;
  --accent-hover: #33dfff;
  --accent-dim: rgba(0, 212, 255, 0.1);
  --danger: #ff4466;
  --danger-hover: #ff6680;
  --danger-dim: rgba(255, 68, 102, 0.1);
  --success: #00cc88;
  --success-dim: rgba(0, 204, 136, 0.1);
  --mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", "Monaco", monospace;
}

html, body {
  height: 100%;
}

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* --- Header --- */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.02em;
  cursor: pointer;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-email {
  font-size: 13px;
  color: var(--text-dim);
}

/* --- Buttons --- */

.btn {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #000;
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--border-hover);
  background: var(--bg-raised);
}

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  padding: 6px 12px;
}

.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  background: var(--bg-raised);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(255, 68, 102, 0.25);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-dim);
  border-color: var(--danger);
}

.btn-sm {
  font-size: 12px;
  padding: 5px 10px;
}

/* --- Inputs --- */

.input {
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
  width: 100%;
}

.input:focus {
  border-color: var(--accent);
}

.input::placeholder {
  color: var(--text-dim);
}

/* --- Auth Screen --- */

.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 400px;
}

.auth-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: -0.02em;
}

.auth-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 32px;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.auth-form .input {
  margin-bottom: 4px;
}

.auth-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.auth-actions .btn {
  flex: 1;
}

.auth-back {
  margin-top: 16px;
  text-align: center;
}

.token-reveal {
  margin: 16px 0;
  padding: 16px;
  background: #0d0d12;
  border: 1px solid #1a1a22;
  border-radius: 6px;
}

.token-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.token-value {
  display: block;
  padding: 10px 12px;
  background: #000;
  border: 1px solid #222;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent);
  word-break: break-all;
  margin-bottom: 8px;
  user-select: all;
}

.token-warning {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 10px;
  line-height: 1.5;
}

/* --- Console Layout --- */

.console {
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 24px;
}

.console-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.console-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

/* --- Back Link --- */

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--mono);
  padding: 0;
  margin-bottom: 24px;
  transition: color 0.15s ease;
}

.back-link:hover {
  color: var(--text);
}

/* --- Project Cards --- */

.project-grid {
  display: grid;
  gap: 12px;
}

.project-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px;
  transition: border-color 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
}

.project-card:hover {
  border-color: var(--border-hover);
}

.project-info {
  min-width: 0;
  flex: 1;
}

.project-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.project-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.project-version {
  font-size: 12px;
  padding: 2px 8px;
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 4px;
  border: 1px solid rgba(0, 212, 255, 0.2);
}

.project-not-deployed {
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
}

.project-url a {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  word-break: break-all;
}

.project-url a:hover {
  text-decoration: underline;
}

/* --- Onboarding Empty State --- */

.onboarding {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 32px;
}

.onboarding-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.onboarding-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 28px;
}

.onboarding-steps {
  list-style: none;
  counter-reset: steps;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.onboarding-step {
  counter-increment: steps;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.onboarding-step::before {
  content: counter(steps);
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  margin-top: 1px;
}

.onboarding-step-content {
  flex: 1;
  min-width: 0;
}

.onboarding-step-label {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 6px;
}

.onboarding-step-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* --- Code Blocks --- */

.code-block {
  display: block;
  padding: 10px 14px;
  background: #000;
  border: 1px solid #1a1a22;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent);
  font-family: var(--mono);
  word-break: break-all;
  user-select: all;
  margin-top: 6px;
}

/* --- Section --- */

.section {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
}

.section-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 12px;
  line-height: 1.5;
}

/* --- Detail Header --- */

.detail-header {
  margin-bottom: 24px;
}

.detail-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.detail-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

/* --- Secrets --- */

.secret-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.secret-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
}

.secret-key {
  font-size: 13px;
  color: var(--text);
}

.secret-add-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.secret-add-form .input {
  flex: 1;
}

/* --- Logs --- */

.log-container {
  background: #000;
  border: 1px solid #1a1a22;
  border-radius: 4px;
  padding: 12px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.7;
}

.log-line {
  white-space: pre-wrap;
  word-break: break-all;
}

.log-ts {
  color: var(--text-dim);
}

.log-server {
  color: #aa88ff;
}

.log-stream-stdout {
  color: var(--text);
}

.log-stream-stderr {
  color: var(--danger);
}

.log-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.log-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

/* --- Danger Zone --- */

.danger-zone {
  background: var(--bg-raised);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 8px;
  padding: 20px 24px;
  margin-top: 16px;
}

.danger-zone .section-title {
  color: var(--danger);
}

.danger-zone-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 12px;
}

/* --- Account --- */

.account-field {
  margin-bottom: 24px;
}

.account-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.account-value {
  font-size: 14px;
  color: var(--text);
}

.account-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 400px;
}

/* --- Modal --- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 24px;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
}

.modal-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 4px;
}

/* --- Loading / Messages --- */

.loading {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-dim);
  font-size: 14px;
}

.error-msg {
  color: var(--danger);
  font-size: 13px;
  margin-top: 8px;
}

.error-banner {
  background: var(--danger-dim);
  border: 1px solid rgba(255, 68, 102, 0.3);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--danger);
  font-size: 13px;
  margin-bottom: 16px;
}

.success-banner {
  background: var(--success-dim);
  border: 1px solid rgba(0, 204, 136, 0.3);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--success);
  font-size: 13px;
  margin-bottom: 16px;
}

/* --- Confirm Dialog --- */

.confirm-text {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.5;
}

.confirm-highlight {
  color: var(--accent);
  font-weight: 600;
}

/* --- Responsive --- */

@media (max-width: 600px) {
  .header {
    padding: 0 16px;
  }

  .console {
    padding: 24px 16px;
  }

  .project-card {
    flex-direction: column;
    align-items: flex-start;
  }

  .auth-actions {
    flex-direction: column;
  }

  .header-email {
    display: none;
  }

  .onboarding {
    padding: 24px 16px;
  }

  .section {
    padding: 16px;
  }

  .secret-add-form {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function() {
  "use strict";

  var API = "https://api.jkbase.app";
  var TOKEN_KEY = "jkbase_token";
  var EMAIL_KEY = "jkbase_email";

  var app = document.getElementById("app");

  // --- State ---
  var state = {
    token: localStorage.getItem(TOKEN_KEY) || null,
    email: localStorage.getItem(EMAIL_KEY) || null,
    view: "loading",
    // views: loading, auth, auth-signin, token-reveal, console, project-detail, account
    projects: [],
    loading: false,
    error: null,
    success: null,
    showNewProjectModal: false,
    deleteConfirm: null,
    revealedToken: null,
    // project detail
    currentProject: null,
    secrets: [],
    logs: [],
    secretsLoading: false,
    logsLoading: false,
    showAddSecret: false,
    deleteSecretConfirm: null,
    // account
    accountLoading: false,
    accountError: null,
    accountSuccess: null,
  };

  // --- API helpers ---

  function api(method, path, body) {
    var headers = { "Content-Type": "application/json" };
    if (state.token) {
      headers["Authorization"] = "Bearer " + state.token;
    }
    var opts = { method: method, headers: headers };
    if (body) {
      opts.body = JSON.stringify(body);
    }
    return fetch(API + path, opts).then(function(res) {
      if (res.status === 401) {
        logout();
        throw new Error("Session expired. Please sign in again.");
      }
      if (res.status === 204) {
        return null;
      }
      return res.json().then(function(data) {
        if (!res.ok) {
          throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
        }
        return data;
      });
    });
  }

  // --- Auth ---

  function logout() {
    state.token = null;
    state.email = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMAIL_KEY);
    state.view = "auth";
    state.projects = [];
    state.currentProject = null;
    state.error = null;
    state.success = null;
    render();
  }

  function verifyToken() {
    api("GET", "/me").then(function(me) {
      state.email = me.email;
      localStorage.setItem(EMAIL_KEY, me.email);
      state.view = "console";
      render();
      loadProjects();
    }).catch(function() {
      state.token = null;
      localStorage.removeItem(TOKEN_KEY);
      state.view = "auth";
      render();
    });
  }

  function doRegister(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/register", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "token-reveal";
      state.revealedToken = data.token;
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function doLogin(email, password) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/login", { email: email, password: password }).then(function(data) {
      state.token = data.token;
      state.email = email;
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(EMAIL_KEY, email);
      state.loading = false;
      state.view = "console";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Projects ---

  function loadProjects() {
    state.loading = true;
    state.error = null;
    render();
    api("GET", "/projects").then(function(projects) {
      state.projects = projects;
      state.loading = false;
      render();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function createProject(name) {
    state.error = null;
    state.loading = true;
    render();
    api("POST", "/projects", { name: name }).then(function() {
      state.showNewProjectModal = false;
      state.loading = false;
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteProject(id) {
    state.error = null;
    state.deleteConfirm = null;
    state.loading = true;
    render();
    api("DELETE", "/projects/" + id).then(function() {
      state.loading = false;
      state.currentProject = null;
      state.view = "console";
      render();
      loadProjects();
    }).catch(function(e) {
      state.loading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Project Detail ---

  function openProject(project) {
    state.currentProject = project;
    state.view = "project-detail";
    state.secrets = [];
    state.logs = [];
    state.error = null;
    state.success = null;
    state.showAddSecret = false;
    state.deleteSecretConfirm = null;
    render();
    loadSecrets(project.id);
    loadLogs(project.id);
  }

  function loadSecrets(projectId) {
    state.secretsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/secrets").then(function(secrets) {
      state.secrets = secrets;
      state.secretsLoading = false;
      render();
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function addSecret(projectId, key, value) {
    state.error = null;
    state.secretsLoading = true;
    render();
    api("POST", "/projects/" + projectId + "/secrets", { key: key, value: value }).then(function() {
      state.showAddSecret = false;
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function deleteSecret(projectId, key) {
    state.error = null;
    state.deleteSecretConfirm = null;
    state.secretsLoading = true;
    render();
    api("DELETE", "/projects/" + projectId + "/secrets/" + encodeURIComponent(key)).then(function() {
      state.secretsLoading = false;
      render();
      loadSecrets(projectId);
    }).catch(function(e) {
      state.secretsLoading = false;
      state.error = e.message;
      render();
    });
  }

  function loadLogs(projectId) {
    state.logsLoading = true;
    render();
    api("GET", "/projects/" + projectId + "/logs?limit=200").then(function(logs) {
      state.logs = logs;
      state.logsLoading = false;
      render();
      // scroll log container to bottom
      var logEl = document.querySelector(".log-container");
      if (logEl) {
        logEl.scrollTop = logEl.scrollHeight;
      }
    }).catch(function(e) {
      state.logsLoading = false;
      state.error = e.message;
      render();
    });
  }

  // --- Account ---

  function generateToken() {
    state.accountError = null;
    state.accountSuccess = null;
    state.accountLoading = true;
    state.revealedToken = null;
    render();
    api("POST", "/me/token", {}).then(function(data) {
      state.revealedToken = data.token;
      state.accountLoading = false;
      // Also update stored token
      state.token = data.token;
      localStorage.setItem(TOKEN_KEY, data.token);
      render();
    }).catch(function(e) {
      state.accountLoading = false;
      state.accountError = e.message;
      render();
    });
  }

  function changePassword(currentPassword, newPassword) {
    state.accountError = null;
    state.accountSuccess = null;
    state.accountLoading = true;
    render();
    api("POST", "/me/password", { current_password: currentPassword, new_password: newPassword }).then(function() {
      state.accountLoading = false;
      state.accountSuccess = "Password changed successfully.";
      render();
    }).catch(function(e) {
      state.accountLoading = false;
      state.accountError = e.message;
      render();
    });
  }

  // --- Rendering ---

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      var keys = Object.keys(attrs);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var v = attrs[k];
        if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === "className") {
          el.className = v;
        } else if (k === "htmlFor") {
          el.setAttribute("for", v);
        } else if (v != null && v !== false) {
          el.setAttribute(k, v);
        }
      }
    }
    for (var a = 2; a < arguments.length; a++) {
      var child = arguments[a];
      if (child == null || child === false) continue;
      if (typeof child === "string" || typeof child === "number") {
        el.appendChild(document.createTextNode(child));
      } else if (Array.isArray(child)) {
        for (var j = 0; j < child.length; j++) {
          if (child[j]) el.appendChild(child[j]);
        }
      } else {
        el.appendChild(child);
      }
    }
    return el;
  }

  function formatTimestamp(ts) {
    try {
      var d = new Date(ts);
      var hh = String(d.getHours()).padStart(2, "0");
      var mm = String(d.getMinutes()).padStart(2, "0");
      var ss = String(d.getSeconds()).padStart(2, "0");
      return hh + ":" + mm + ":" + ss;
    } catch (e) {
      return ts;
    }
  }

  // --- Main Render ---

  function render() {
    app.innerHTML = "";
    var view;
    switch (state.view) {
      case "loading":
        view = h("div", { className: "auth-screen" },
          h("div", { className: "loading" }, "Loading...")
        );
        break;
      case "auth":
        view = renderAuthScreen();
        break;
      case "auth-signin":
        view = renderSignInScreen();
        break;
      case "token-reveal":
        view = renderTokenRevealScreen();
        break;
      case "console":
        view = renderProjectList();
        break;
      case "project-detail":
        view = renderProjectDetail();
        break;
      case "account":
        view = renderAccountView();
        break;
      default:
        view = renderProjectList();
    }
    app.appendChild(view);

    // Auto-focus first input in view
    var firstInput = app.querySelector("input:not([disabled])");
    if (firstInput && document.activeElement && !document.activeElement.matches("input")) {
      firstInput.focus();
    }
  }

  // --- Init ---

  if (state.token) {
    state.view = "loading";
    render();
    verifyToken();
  } else {
    state.view = "auth";
    render();
  }
})();
