[package]
name = "jkbase-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "jkbase"
path = "src/main.rs"

[dependencies]
jkbase-common = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
dirs = "6"
# `jkbase upgrade`: verify the release archive against its SHA256SUMS.
sha2 = { workspace = true }
# `jkbase db proxy` sidecar: client TLS to the managed-DB reach-plane edge.
# ring only (db_proxy names the ring provider explicitly): rustls/tokio-rustls defaults pull in
# aws-lc-sys, a C/CMake build that breaks the static-musl release cross-compiles.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = { workspace = true }
rustls-pemfile = { workspace = true }
# `jkbase upgrade`: verify SHA256SUMS.sig (SSH signature, Ed25519) — see commands/release_sig.rs.
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }

[dev-dependencies]
# The reach-plane sidecar's integration test stands up a real local rustls server
# (self-signed) to prove the client-side tls-exporter matches the server's and the
# ALPN/SNI/preamble wire contract round-trips.
rcgen = { workspace = true }
