[package]
name = "jkbase-substrate"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
bitflags = { workspace = true }
tokio = { workspace = true }
redb = { workspace = true }

# Cluster-grade R4 (BlobStore) backend over any S3-compatible endpoint. Optional:
# the default single-node build takes no cloud dependency (LocalFsBlobStore only).
object_store = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
# Cluster-grade replicated R1 (ControlStore) + R2 (Lease) over etcd. Optional.
etcd-client = { workspace = true, optional = true }

[features]
# `s3` enables S3CompatBlobStore (object_store/aws). Off by default.
s3 = ["dep:object_store", "dep:tokio-util", "dep:futures-util"]
# `etcd` enables EtcdControlStore (replicated R1). Off by default.
etcd = ["dep:etcd-client"]

[dev-dependencies]
tokio = { workspace = true }
trybuild = "1"
