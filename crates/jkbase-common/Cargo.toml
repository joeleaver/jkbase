[package]
name = "jkbase-common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
# SigV4 now lives in the `jkbase-sigv4` leaf crate; re-exported as `jkbase_common::sigv4`
# so existing call sites are unchanged and there's still exactly ONE implementation.
jkbase-sigv4 = { workspace = true }
# `sha2` is still used directly here by `layers.rs` (content-addressed layer digests).
sha2 = { workspace = true }
# HMAC-SHA256 for the L4 UDP transit wire auth (`l4_transit`), the same pure-Rust
# RustCrypto pair the SigV4 signer uses — builds for the agent's musl target.
hmac = { workspace = true }
