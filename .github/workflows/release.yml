name: Release CLI

# A `cli-v<version>` tag publishes prebuilt `jkbase` binaries as a GitHub Release — what
# `install.sh` / `install.ps1` (sites/www) and `jkbase upgrade` download. The tag must equal the
# workspace version (Cargo.toml `[workspace.package] version`), which is also what the server
# advertises at `GET /cli`; so tag + publish BEFORE deploying a server that advertises it.
# Pull requests touching the CLI build every target (no release) so a break shows before merge.
on:
  push:
    tags: ["cli-v*"]
  pull_request:
    paths:
      - "crates/jkbase-cli/**"
      - "crates/jkbase-common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
      - "sites/www/install.sh"
      - "sites/www/install.ps1"
      - "sites/www/tests/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Once, on Linux (the Windows runner has no reliable python3): a tag must name the workspace
  # version, or `jkbase upgrade` would install a binary reporting a different one (and refuse it).
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          want="${GITHUB_REF_NAME#cli-v}"
          have="$(cargo pkgid -p jkbase-cli | sed 's/.*[#@]//')"
          [ -n "$have" ] && [ "$want" = "$have" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != workspace version '$have'"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # ring compiles C. For a -musl target on a -gnu host the cc crate looks for
      # `<arch>-linux-musl-gcc`, which Ubuntu doesn't ship (musl-tools has only `musl-gcc`).
      - name: musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          t="$(echo '${{ matrix.target }}' | tr '-' '_')"
          echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_$t=ar" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the compiler; add this job's target to it.
      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build -p jkbase-cli --release --locked --target ${{ matrix.target }}

      - name: Smoke (--version)
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          out="$(target/${{ matrix.target }}/release/jkbase${{ matrix.exe }} --version)"
          echo "$out"
          case "$out" in "jkbase "[0-9]*) ;; *) echo "::error::unexpected --version: $out"; exit 1 ;; esac

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jkbase${{ matrix.exe }}" dist/
          tar -C dist -czf "jkbase-${{ matrix.target }}.tar.gz" "jkbase${{ matrix.exe }}"
          tar -tzf "jkbase-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: jkbase-${{ matrix.target }}
          path: jkbase-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The install scripts' signature checks, against a fake release signed with throwaway keys.
  install-sh:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: sh sites/www/tests/install_sh_test.sh

  install-ps1:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jkbase-x86_64-pc-windows-msvc
          path: dist
      - name: install.ps1 tests
        shell: pwsh
        run: |
          tar -xzf dist/jkbase-x86_64-pc-windows-msvc.tar.gz -C dist jkbase.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./sites/www/tests/install_ps1_test.ps1 -Exe (Resolve-Path dist/jkbase.exe).Path

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: [build, install-sh, install-ps1]
    runs-on: ubuntu-24.04
    # Holds the CLI_SIGNING_KEY secret. The environment admits only `cli-v*` tags AND needs a
    # maintainer's approval per run: a tag runs the workflow file AT that tag, so the tag pattern
    # alone wouldn't stop someone with push rights. Setup + rotation: docs/cli-release-signing.md.
    environment: cli-release
    permissions:
      contents: write
    steps:
      # This job holds the signing key: its actions are pinned to commits, not movable tags.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5, for release-keys/allowed_signers at the tagged commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      # The version line is inside the signed bytes, so an older signed release served in place
      # of a newer one is detectable (installers compare it; `sha256sum -c` skips `#` lines).
      - name: Checksums
        working-directory: dist
        run: |
          { echo "# jkbase-cli ${GITHUB_REF_NAME#cli-v}"; sha256sum jkbase-*.tar.gz; } | tee SHA256SUMS

      # SHA256SUMS.sig: what install.sh, install.ps1 and `jkbase upgrade` verify (fail-closed)
      # before trusting SHA256SUMS. Then check it with the tagged commit's trust root, so a key
      # that doesn't match what this release's CLI/scripts trust fails here, not on users.
      - name: Sign
        env:
          CLI_SIGNING_KEY: ${{ secrets.CLI_SIGNING_KEY }}
        run: |
          [ -n "$CLI_SIGNING_KEY" ] || { echo "::error::CLI_SIGNING_KEY secret is not set in the cli-release environment"; exit 1; }
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$CLI_SIGNING_KEY" >"$key")
          ssh-keygen -q -Y sign -f "$key" -n jkbase-cli-release dist/SHA256SUMS </dev/null
          ssh-keygen -Y verify -f crates/jkbase-cli/release-keys/allowed_signers \
            -I jkbase-release -n jkbase-cli-release -s dist/SHA256SUMS.sig <dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#cli-v}"
          cat > notes.md <<EOF
          Install or update:

          \`\`\`bash
          curl -fsSL https://jkbase.app/install.sh | sh
          \`\`\`

          Windows (PowerShell): \`irm https://jkbase.app/install.ps1 | iex\`

          Already installed? \`jkbase upgrade\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "jkbase CLI $ver" \
            --notes-file notes.md \
            --verify-tag
