name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: deliberately no `cargo fmt --check` — the tree carries heavy
      # pre-existing rustfmt drift that a format gate would flag wholesale.

      - name: Clippy (workspace, warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build-mirror CA isolation (invariant I-3): the build-mirror CA is baked ONLY
      # into BUILD toolchains (tools/build-image.sh). It must NEVER reach a runtime
      # image — neither the runtime apko configs nor the runtime-layer builder may
      # reference it, or a tenant app would trust a CA that can impersonate registries.
      - name: Build-mirror CA never in runtime path (I-3)
        run: |
          if grep -RnE 'jkbase-build-ca|BUILD_CA_CERT' \
               images/apko/run-*.apko.yaml tools/build-base-layer.sh; then
            echo "::error::build-mirror CA referenced in a runtime image path (violates I-3)"
            exit 1
          fi
          echo "OK: no build-mirror CA reference in runtime image configs/builder"

      # Upstream-leg trust isolation (invariant I-2): the mirror's reqwest client must
      # validate REAL registry certs against PUBLIC webpki roots only. rustls-native-certs
      # is already compiled in transitively (hyper-rustls), so a feature-unification that
      # turned on reqwest's native-roots/native-tls would silently let the upstream leg
      # trust the host OS store — which on a mirror host has the build CA appended. Fail
      # if reqwest ever resolves with native roots.
      - name: Mirror upstream leg uses webpki roots only (I-2)
        run: |
          # Capture the feature tree once and FAIL CLOSED: if cargo tree errors or
          # reqwest stops resolving (rename/removal/resolver change), an empty/garbled
          # tree must abort, not silently pass. (A bare `... | grep -q` would pass on
          # empty input.) Assert the tree both resolved AND still carries webpki-roots,
          # THEN reject any native-roots/native-tls feature.
          tree="$(cargo tree -e features -p jkbase-server -i reqwest)"
          if ! printf '%s\n' "$tree" | grep -q 'rustls-tls-webpki-roots'; then
            echo "::error::reqwest webpki-roots feature missing/unresolved — cannot verify I-2"
            exit 1
          fi
          if printf '%s\n' "$tree" | grep -qE 'rustls-tls-native-roots|native-tls'; then
            echo "::error::reqwest enabled native-roots/native-tls — I-2 (webpki-only upstream) at risk"
            exit 1
          fi
          echo "OK: reqwest upstream TLS resolves against webpki roots only"

      # Runs the substrate neutrality grep gate + the trybuild role-trait
      # compile-fail check too. KVM/root/network-gated tests are #[ignore]d, so
      # they are skipped on the runner.
      - name: Test (workspace)
        run: cargo test --workspace

      # The substrate's optional cluster backends are feature-gated (off by
      # default, so the line above never compiles them). Exercise each backend's
      # lint + non-network unit tests, each feature ALONE (catches a feature that
      # leans on another's deps), so they can't bit-rot. The live MinIO/etcd
      # contract tests are #[ignore]d and run only with --ignored + a server.
      # etcd-client compiles protobufs at build time, hence protoc.
      - name: Install protoc (etcd backend builds protobufs)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Substrate cluster backends (feature-gated)
        run: |
          cargo clippy -p jkbase-substrate --features s3 --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features s3
          cargo clippy -p jkbase-substrate --features etcd --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features etcd
          cargo clippy -p jkbase-substrate --features ceph --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features ceph

  # The object-store JS SDK: cross-validates its SigV4 signatures against the Rust
  # server's vectors (so JS-signed requests verify server-side).
  js-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SDK SigV4 cross-validation
        run: node --test sdk/js/objectstore.test.mjs
