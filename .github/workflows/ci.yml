name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # NOTE: deliberately no `cargo fmt --check` — the tree carries heavy
      # pre-existing rustfmt drift that a format gate would flag wholesale.

      - name: Clippy (workspace, warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the substrate neutrality grep gate + the trybuild role-trait
      # compile-fail check too. KVM/root/network-gated tests are #[ignore]d, so
      # they are skipped on the runner.
      - name: Test (workspace)
        run: cargo test --workspace

      # The substrate's optional cluster backends are feature-gated (off by
      # default, so the line above never compiles them). Exercise each backend's
      # lint + non-network unit tests, each feature ALONE (catches a feature that
      # leans on another's deps), so they can't bit-rot. The live MinIO/etcd
      # contract tests are #[ignore]d and run only with --ignored + a server.
      # etcd-client compiles protobufs at build time, hence protoc.
      - name: Install protoc (etcd backend builds protobufs)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Substrate cluster backends (feature-gated)
        run: |
          cargo clippy -p jkbase-substrate --features s3 --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features s3
          cargo clippy -p jkbase-substrate --features etcd --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features etcd
          cargo clippy -p jkbase-substrate --features ceph --all-targets -- -D warnings
          cargo test -p jkbase-substrate --features ceph

  # The object-store JS SDK: cross-validates its SigV4 signatures against the Rust
  # server's vectors (so JS-signed requests verify server-side).
  js-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SDK SigV4 cross-validation
        run: node --test sdk/js/objectstore.test.mjs
