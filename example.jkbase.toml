[project]
name = "my-app"

[hosting]
public = "./dist"
spa = true

# Server-side build: push raw source, the platform builds it (no Dockerfile).
# `language` is optional — it's auto-detected from the source (e.g. bun.lock /
# bun.lockb / a "bun@…" packageManager). Bun, Node, Rust, Python and Go all
# build server-side from source.
[servers.api]
source = "./server"
language = "bun"
port = 8080
health_check = { path = "/health", interval = "10s", timeout = "5s" }
volumes = [{ name = "data", mount = "/app/data" }]

# Bring-your-own Dockerfile is a supported escape hatch, not a requirement. The
# platform builds it SERVER-SIDE (no docker on your machine) and runs the resulting
# image. `language` must be omitted (the image carries its own runtime); `dockerfile`
# defaults to <source>/Dockerfile. `port` is still authoritative for routing.
#   [servers.api]
#   builder = "dockerfile"
#   dockerfile = "./Dockerfile"
#   port = 8080

[routes]
"/api/*" = { service = "server", name = "api" }
